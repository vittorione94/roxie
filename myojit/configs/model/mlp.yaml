actor:
  # The _target_ points to the Python class you want to instantiate.
  # Make sure the path is correct for your project structure.
  _target_: models.actors.DeterministicActor

  # --- Required __init__ arguments ---
  features: [256, 256]  # Defines the two hidden layers
  action_dim: 2         # Example: Matches environment's action space shape

  # --- Optional __init__ arguments ---
  use_layer_norm: false
  dropout_rate: 0.1
  # activation_fn can also be specified if you want to override the default
  # activation_fn: "flax.experimental.nnx.gelu"

critic:
  # Path to the Critic class
  _target_: models.critics.DeterministicCritic
  features: [256, 256]
  # activation_fn: flax.linen.relu
  use_layer_norm: true # Example: Critic uses LayerNorm
  dropout_rate: 0.1   # Example: Critic uses Dropout