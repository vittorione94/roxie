name: "ddpg"

args: 
  gamma: 0.99
  tau: 0.005
  actor_learning_rate: 5e-4
  critic_learning_rate: 1e-3
  target_policy_noise: 0.05       # target smoothing noise
  target_noise_clip: 0.1
  memory_warmup: 30_000            # start updates after 30k transitions (~75 loops @ 400 envs)
  steps_before_learning: 30_000    # same as warmup (can differ if desired)
  steps_between_updates: 400      # update every 400 new transitions (~once per trainer loop)
  learning_steps: 20              # gradient steps per update trigger
  max_grad_norm: 1

actor:
  # The _target_ points to the Python class you want to instantiate.
  # Make sure the path is correct for your project structure.
  _target_: models.actors.DeterministicActor

  # --- Required __init__ arguments ---
  features: [256, 256]  # Defines the two hidden layers

  # --- Optional __init__ arguments ---
  use_layer_norm: false
  dropout_rate: 0.


critic:
  # Path to the Critic class
  _target_: models.critics.DeterministicCritic
  features: [256, 256]
  use_layer_norm: false 
  dropout_rate: 0.   

memory:
  _target_: replays.buffer.JaxReplayBuffer
  
  capacity: 1_000_000
  batch_size: 256
