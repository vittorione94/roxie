# @package _global_

defaults:
  - /agent: sac_mocap
  - /noise: ou
  - _self_

env:
  seed: 0
  parallel_envs: 800
  # Experiment-injected env factory + viewer hook (resolved by train.py /
  # play.py via hydra.utils.get_method), so the core loops never branch on
  # an env-type string.
  builder: examples.mocap.loader.build_mocap_env
  viewer: examples.mocap.loader.mocap_viewer_extras
  env_name: null
  list_envs: false
  clip_ids: []
  gpu_clip_budget: 100
  # Physics backend: "jax" (MJX) or "warp" (mujoco_warp). For warp, tune the
  # contact/constraint budgets in the viewer and scale by parallel_envs; null
  # lets mujoco_warp pick defaults.
  impl: jax
  naconmax: null
  njmax: null
  # Full humanoid self-collision (limbs collide with each other, not just the
  # floor). NOTE: the impl=jax (MJX) backend statically sizes its contact arrays
  # to all potential geom pairs (~980) rather than the ~15 active at peak, so
  # this is much heavier on memory than on the warp backend. Set false for
  # ground-only contacts if memory-constrained.
  self_collisions: true
  # Early-termination curriculum (DeepMimic-style). Terminates an episode when
  # the joint-pose or root (pos+orientation) tracking error exceeds a bound that
  # widens with training progress (steps/trainer.steps, so independent of
  # parallel_envs): tight at step 0 -> loose at relax_fraction of training, after
  # which the tracking-error check is off (only head-height/NaN remain). Errors
  # are in _get_reward units. Omit this block to use the env's default_config.
  termination_curriculum:
    enabled: true
    pose: 5.0
    root: 0.1


trainer:
  steps: 1_000_000_000
  epoch_steps: 100_000
  save_steps: 500_000
  test_episodes: 5
  show_progress: true
  replace_checkpoint: false

# Metric logging backends. Console + CSV (in the run's output dir) are always
# on. Set logging.wandb.enabled: true to also stream metrics to Weights &
# Biases (requires the `wandb` package; run `wandb login` once).
logging:
  wandb:
    enabled: false
    project: roxie
    entity: null
    name: null
    group: null
    tags: []
    mode: online   # online | offline | disabled
    # Re-prompt for the wandb API key on every run so a multi-account desktop
    # never logs to the wrong account by reusing cached credentials. Set false
    # to trust the existing login (or set WANDB_API_KEY, which also skips it).
    relogin: true

hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
