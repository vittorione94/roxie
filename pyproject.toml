[project]
name = "roxie"
version = "0.1.0"
description = "Reinforcement learning in JAX for continuous control in MuJoCo, across MJX, mujoco_warp and mujoco.batch physics backends"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vittorio La Barbera" }]
keywords = ["reinforcement-learning", "jax", "mujoco", "mjx", "warp", "continuous-control"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "chex>=0.1.90",
    "click>=8.1",
    "distrax>=0.1.5",
    "flashbax>=0.1.3",
    "flax>=0.8.5",
    "hydra-core>=1.3.2",
    "numpy>=2.0.2",
    "optax>=0.2.4",
    # 1.0 drops the dm_control suite, and with it the humanoid release tasks.
    "playground>=0.2.0,<1.0",
    "rlax>=0.1.7",
    "termcolor>=3.1.0",
    "etils>=1.13.0",
    "mujoco>=4.0.0",
    "mujoco-mjx>=4.0.0",
    "gymnasium>=1.0",
    "wandb>=0.18.0",
    "pandas>=3.0.3",
    "matplotlib>=3.8",
    # Imported directly by scripts/render_gif.py for GIF palette quantization;
    # it arrives under matplotlib anyway, but nothing should rely on that.
    "pillow>=10.0",
]

[project.urls]
Homepage = "https://github.com/vittorione94/roxie"
Repository = "https://github.com/vittorione94/roxie"

[project.optional-dependencies]
report = [
    "wandb-workspaces>=0.4.5",
]
# scripts/export_release_weights.py --push-to-hub only. Publishing the release
# policies is a maintainer step, so this stays out of the default install.
hub = [
    "huggingface-hub>=0.26",
]

[dependency-groups]
# Test-only. Installed by default with `uv sync`; excluded from a pip install.
dev = [
    "pytest>=9.1.1",
]

# Linux (NVIDIA): uv sync --group cuda
# mujoco-mjx pins the warp its bridge is built against in its own `warp` extra;
# mjx fails at import on an older warp.
cuda = [
    "jax[cuda12]>=0.4.30",
    "warp-lang==1.18.0",
]

[tool.pytest.ini_options]
# Upstream deprecations, each raised inside the dependency itself and not
# reachable from this repo's code. Delete a line when its package releases a
# fix rather than widening the pattern.
filterwarnings = [
    "ignore:jax.core.pytype_aval_mappings is deprecated:DeprecationWarning:tensorflow_probability.*",
    "ignore:JAXopt is no longer maintained:DeprecationWarning:jaxopt.*",
    "ignore:Rlax categorical_cross_entropy will be deprecated:PendingDeprecationWarning:rlax.*",
]

[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

# Explicit setuptools package discovery: only include the roxie package
[tool.setuptools.packages.find]
include = ["roxie*"]

