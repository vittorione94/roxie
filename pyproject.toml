[project]
name = "roxie"
version = "0.1.0"
description = "Reinforcement learning in JAX for continuous control in MuJoCo, across MJX, mujoco_warp and native-CPU physics backends"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vittorio La Barbera" }]
keywords = ["reinforcement-learning", "jax", "mujoco", "mjx", "warp", "continuous-control"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "chex>=0.1.90",
    "click>=8.1",
    "distrax>=0.1.5",
    "flashbax>=0.1.3",
    "flax>=0.8.5",
    "hydra-core>=1.3.2",
    "numpy>=2.0.2",
    "optax>=0.2.4",
    "playground>=0.2.0",
    "rlax>=0.1.7",
    "termcolor>=3.1.0",
    "etils>=1.13.0",
    "mujoco-mjx>=3.9.0",
    "wandb>=0.18.0",
    "pandas>=3.0.3",
    "matplotlib>=3.8",
    # The benchmark's second physics implementation: the same dm_control tasks
    # through native MuJoCo on CPU threads. Not optional — it is half the grid.
    "envpool>=1.2.5",
]
# dm-control / h5py / labmaze were direct dependencies only for the CMU mocap
# task, which now lives in its own repo (roxie-mocap) and declares them itself.
# mujoco_playground pulls in whatever of dm_control it needs on its own.

[project.urls]
Homepage = "https://github.com/vittorione94/roxie"
Repository = "https://github.com/vittorione94/roxie"

[project.optional-dependencies]
report = [
    "wandb-workspaces>=0.4.5",
]

[dependency-groups]
# Test-only. Installed by default with `uv sync`; excluded from a pip install.
dev = [
    "pytest>=9.1.1",
]

# Linux (NVIDIA): uv sync --group cuda
# mujocos warp bridge imports warp._src.jax_experimental.ffi.GraphMode and
# reads public warp.types.warp_type_to_np_dtype. Warp 1.13 dropped the latter
# from the public API and 1.14 graduated jax_experimental (NVIDIA/warp#1370),
# moving both out from under the bridge. 1.12.x is the newest that has both.
cuda = [
    "jax[cuda12]>=0.4.30",
    "warp-lang>=1.11,<1.13",
]

[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

# Explicit setuptools package discovery: only include the roxie package
[tool.setuptools.packages.find]
include = ["roxie*"]

