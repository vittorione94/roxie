[project]
name = "roxie"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "chex>=0.1.90",
    "distrax>=0.1.5",
    "flashbax>=0.1.3",
    "flax>=0.8.5",
    "hydra-core>=1.3.2",
    "jax>=0.4.30",
    "numpy>=2.0.2",
    "optax>=0.2.4",
    "playground>=0.0.2",
    "rlax>=0.1.7",
    "termcolor>=3.1.0",
    "etils>=1.13.0"
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

# Explicit setuptools package discovery: only include the roxie package
[tool.setuptools.packages.find]
include = ["roxie*"]

