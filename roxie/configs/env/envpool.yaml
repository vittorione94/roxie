_target_: roxie.environment.loader.build_envpool_env

# EnvPool envs — native C++ physics stepped on a CPU thread pool, the GPU-free
# path. The pools auto-reset and time-limit internally and return gymnasium's
# 5-tuple, so `EnvPoolVectorEnv` presents them to the trainer with no adapter.
#
# A launchable picks it up in its defaults list, then overrides what it needs:
#
#   defaults:
#     - /agent: sac
#     - /env: envpool
#     - _self_
#
#   env:
#     task_id: HalfCheetah-v4        # or ${envpool_task:CheetahRun}
#
# (See env/playground.yaml on the leading `/`, and on why the release benchmark
# uses `experiments/dmc/backend/` instead of this group.)
#
# Two pools are built, one for training and one for evaluation. The eval pool is
# sized from `trainer.test_episodes` — do NOT add a `test_episodes` key here.
#
# ANY KEY NOT LISTED BELOW is forwarded to `envpool.make()` as a task kwarg, so
# a per-task option needs no change to roxie; the flip side is that a typo in
# one of the keys below is a TypeError at launch.

# For a dm_control task named the playground way, `${envpool_task:CheetahRun}`
# translates it — roxie.environment.suites owns that mapping.
task_id: ???

# A pool steps native MuJoCo on C++ threads, so `cpu` is the only answer.
device: cpu

# null = loader.DEFAULT_MAX_EPISODE_STEPS.
max_episode_steps: null

# Training gets `seed`, evaluation `seed + 1`, and the eval pool is re-seeded
# from here before every eval so its start states are pinned.
seed: 0

# NOT a builder argument — the trainer injects it as `num_envs` — but it lives
# here because every agent's replay buffer reads it back as
# `${env.parallel_envs}`.
parallel_envs: 32
