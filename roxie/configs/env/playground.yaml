_target_: roxie.environment.loader.build_playground_env

# mujoco_playground envs — the env family every release benchmark cell runs.
# `impl` picks the physics: MJX, mujoco_warp, or `batch` for native MuJoCo on a
# CPU thread pool.
#
# A launchable picks it up in its defaults list, then overrides what it needs:
#
#   defaults:
#     - /agent: sac
#     - /env: playground
#     - _self_
#
#   env:
#     env_name: HumanoidWalk
#     impl: warp
#
#   uv run python roxie/train.py --config-name my/experiment env.env_name=WalkerWalk
#
# (The leading `/` is what reaches this group from a launchable that lives in a
# subdirectory of `experiments/`; Hydra otherwise looks for `<dir>/env/`. The
# release benchmark deliberately does NOT use this group — its env block comes
# from `experiments/release/backend/`, which is the variable under test there.)
#
# Like an agent config, this file IS the builder call: every key below is one of
# `build_playground_env`'s keyword arguments, so a knob missing here would be
# invisible in the run's config and unsweepable.
# `tests/test_env_configs.py` pins both directions.

# The mujoco_playground registry name.
env_name: ???

impl: jax
naconmax: null
njmax: null

# Warp's CUDA-graph capture mode; MJX ignores it. null does NOT mean "mjx's
# default" here — it means `loader.DEFAULT_WARP_GRAPH_MODE`
# (WARP_STAGED_EX), because mjx's own default (WARP) recaptures a graph every
# step under JAX and leaks ~0.1 GB of HOST ram per million steps, which
# OOM-kills a long run. Set it only to test that claim: `WARP` reproduces the
# leak, `JAX`/`NONE` avoid it eagerly and are much slower.
graph_mode: null

# Render pixel observations instead of the state vector. Only tasks
# mujoco_playground implements a vision mode for accept it (CartpoleBalance and
# CartpoleSwingup today), and only on `impl: warp`, which renders through
# mujoco_warp. Pair it with the `vision` config group so the networks read them.
vision: false
max_episode_steps: null
# impl: batch only. The size of mujoco.batch's thread pool; null takes every core
# this process may run on.
num_threads: null
seed: 0
parallel_envs: 256
