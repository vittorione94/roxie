_target_: roxie.environment.loader.build_playground_env

# mujoco_playground envs; `impl` picks MJX, mujoco_warp or `batch` (native CPU).
# Pulled in as `- /env: playground` (see docs/environments.md). Every key is a
# `build_playground_env` kwarg; tests/test_env_configs.py checks both ways.

env_name: ???

impl: jax
naconmax: null
njmax: null

# null means WARP_STAGED_EX, not mjx's WARP, which leaks host RAM (docs/backends.md).
graph_mode: null

# Needs `impl: warp` and a task with a vision mode (the Cartpoles); pair with the `vision` group.
vision: false
max_episode_steps: null
# impl: batch only; null takes every core this process may run on.
num_threads: null
seed: 0
parallel_envs: 256
