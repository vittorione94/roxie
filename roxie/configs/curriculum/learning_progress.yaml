# Samples the replay by how fast each task's score moves (fast minus slow average).
# Multi-task env and off-policy agent only; see docs/training.md#several-tasks.
_target_: roxie.utils.curriculum.LearningProgressTasks
# A dm_control episode's max return.
score_scale: 1000.0
# Share of every draw spread uniformly, so no task starves.
floor: 0.2
fast_rate: 0.5
slow_rate: 0.1
