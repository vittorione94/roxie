_target_: roxie.exploration.noisy.CompositeNoise
noise_modules:
  - _target_: roxie.exploration.noisy.GaussianNoise
    initial_noise_scale: 0.1
    decay_schedule:
      _target_: roxie.exploration.schedulers.LinearDecay
      decay_steps: 100000
      final_value: 0.01
  - _target_: roxie.exploration.noisy.OrnsteinUhlenbeckNoise
    initial_noise_scale: 0.05
    decay_schedule:
      _target_: roxie.exploration.schedulers.LinearDecay
      decay_steps: 100000
      final_value: 0.005
    theta: 0.15
    dt: 1e-2
    clip: 2.0
    mu: 0.0
weights: [0.3, 0.7]
