_target_: exploration.noisy.CompositeNoise
noise_modules:
  - _target_: exploration.noisy.GaussianNoise
    initial_noise_scale: 0.1
    decay_schedule:
      _target_: exploration.schedulers.LinearDecay
      decay_steps: 100000
      final_value: 0.01
  - _target_: exploration.noisy.OrnsteinUhlenbeckNoise
    initial_noise_scale: 0.05
    decay_schedule:
      _target_: exploration.schedulers.LinearDecay
      decay_steps: 100000
      final_value: 0.005
    damping: 0.15
    mu: 0.0
weights: [0.3, 0.7]