# @package _global_

defaults:
  - /agent: sac
  - /noise: ou
  - _self_

env:
  seed: 0
  parallel_envs: 800
  env_type: playground
  env_name: WalkerWalk
  list_envs: false
  xml_path: null
  clip_path: null

trainer:
  steps: 1_000_000_000
  epoch_steps: 100_000
  save_steps: 500_000
  test_episodes: 5
  show_progress: true
  replace_checkpoint: false

hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
