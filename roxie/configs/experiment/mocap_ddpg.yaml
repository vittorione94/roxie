# @package _global_

defaults:
  - /agent: ddpg
  - /noise: ou
  - _self_

env:
  seed: 0
  parallel_envs: 800
  env_type: mocap
  env_name: null
  list_envs: false
  xml_path: roxie/data/assets/humanoid_suite.xml
  clip_path: roxie/data/clips/standing.npz

trainer:
  steps: 1_000_000_000
  epoch_steps: 100_000
  save_steps: 500_000
  test_episodes: 5
  show_progress: true
  replace_checkpoint: false

hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
