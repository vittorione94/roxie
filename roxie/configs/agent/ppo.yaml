_target_: roxie.agents.PPO

# `cpu`, `gpu`, or null for whatever JAX picks. Independent of `env.device`:
# CPU physics with a GPU learner is a real configuration (docs/backends.md).
device: null

gamma: 0.99
actor_learning_rate: 5e-4
critic_learning_rate: 1e-3
gae_lambda: 0.95                # GAE bias/variance trade-off (1 = Monte Carlo)
clip_eps: 0.2                   # PPO surrogate clip range
entropy_coef: 0.01              # entropy bonus weight in the actor loss
# Stops the learning_steps loop once the policy has drifted this far (Schulman's
# approx KL), making `learning_steps` an upper bound. null disables it.
target_kl: 0.02
# Passes over each rollout before it is discarded. At 1 the ratio is identically
# 1, the clip never binds, and this reduces to A2C.
learning_steps: 20
# Minibatches per epoch, splitting the env axis; must divide
# memory.add_batch_size below. 1 = full-batch (previous behaviour).
num_minibatches: 4
max_grad_norm: 1
normalize_observations: true
obs_norm_clip: 5.0
obs_norm_eps: 1e-08

actor_config:
  _target_: roxie.models.actors.StochasticActor
  features: [256, 256]
  use_layer_norm: false
  # Surfaced rather than left to the class default: PPO's log-ratio divides by
  # sigma, so this floor sets how fast approx_kl can move. See ppo_bench.yaml.
  std_min: 1e-2
  std_max: 5.0

critic_config:
  _target_: roxie.models.critics.VCritic
  features: [256, 256]
  use_layer_norm: false

memory_config:
  _target_: flashbax.buffers.make_trajectory_queue
  max_length_time_axis: 1000  # max length of each env trajectory
  add_batch_size: 800         # the number of envs
  add_sequence_length: 1
  sample_sequence_length: 50  # the flat buffer's sample_batch_size equivalent

# Feeds `nnx.Rngs`; the actor and each critic head take distinct derived offsets
# so twin critics never start identical.
seed: 0

# `_target_` picks the optax family; the learning rate stays a top-level arg
# above so it remains swept, logged and checkpointed. For a schedule instead of
# a constant rate, give the block its own `learning_rate:` sub-block — one that
# declares it wins over the scalar arg. Swapping family from the CLI must also
# drop the kwargs the new family does not take: hydra MERGES dict overrides
# rather than replacing them.
actor_optimizer_config:
  _target_: optax.adam
  b1: 0.9
  b2: 0.999
  eps: 1e-8
critic_optimizer_config:
  _target_: optax.adam
  b1: 0.9
  b2: 0.999
  eps: 1e-8
