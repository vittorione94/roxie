name: "ppo"

args: 
  gamma: 0.99
  actor_learning_rate: 5e-4
  critic_learning_rate: 1e-3
  # steps_before_learning: 30_000    # same as warmup (can differ if desired)
  gae_lambda: 0.95                # GAE bias/variance trade-off (1 = Monte Carlo)
  clip_eps: 0.2                   # PPO surrogate clip range
  entropy_coef: 0.01              # entropy bonus weight in the actor loss
  # Stop the learning_steps loop once the policy has drifted this far from the
  # behaviour policy (Schulman's approx KL). Keeps `learning_steps` an upper
  # bound rather than a fixed count, so extra passes are only taken while the
  # trust region still holds. null disables the early stop.
  target_kl: 0.02
  # Gradient passes over each collected rollout before it is discarded. Only
  # meaningful because old_log_probs stay pinned to the behaviour policy across
  # the passes; at 1 the ratio is identically 1, the clip never binds and this
  # reduces to A2C.
  learning_steps: 20
  # Minibatches per epoch, splitting the env axis; must divide
  # memory.add_batch_size below. 1 = full-batch (previous behaviour).
  num_minibatches: 4
  max_grad_norm: 1

actor:
  # The _target_ points to the Python class you want to instantiate.
  # Make sure the path is correct for your project structure.
  _target_: roxie.models.actors.StochasticActor

  # --- Required __init__ arguments ---
  features: [256, 256]  # Defines the two hidden layers

  # --- Optional __init__ arguments ---
  use_layer_norm: false
  # dropout_rate: 0.


critic:
  # Path to the Critic class
  _target_: roxie.models.critics.VCritic
  features: [256, 256]
  use_layer_norm: false 
  # dropout_rate: 0.   

memory:
  _target_: flashbax.buffers.make_trajectory_queue
  max_length_time_axis: 1000 # max length of each env trajectory
  add_batch_size: 800 # the number of envs
  add_sequence_length: 1
  sample_sequence_length: 50 # equivalent to sample_batch_size for flat buffer

