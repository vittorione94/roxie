_target_: roxie.agents.D4PG

hyperparams:
  _target_: roxie.agents.hyperparams.DDPGHyperparams

  gamma: 0.99
  tau: 0.005
  actor_learning_rate: 3e-4
  critic_learning_rate: 3e-4
  target_policy_noise: 0.0        # D4PG paper doesn't smooth the target policy
  target_noise_clip: 0.0
  n_step: 5                       # paper's N-step return horizon
  memory_warmup: 30_000
  steps_between_updates: 400
  learning_steps: 100
  max_grad_norm: 1
  pre_activation_coef: 0.0   # actor pre-tanh saturation penalty; 0 = off
  normalize_observations: true
  obs_norm_clip: 5.0
  obs_norm_eps: 1e-08
  seed: 0

actor_config:
  _target_: roxie.models.actors.DeterministicActor
  in_features: ${env.obs_size}
  action_dim: ${env.action_size}
  features: [256, 256]
  use_layer_norm: true
  dropout_rate: 0.
  rngs:
    _target_: roxie.agents.utils.network_rngs
    seed: ${agent.hyperparams.seed}
    offset: 0

critic_config:
  _target_: roxie.models.critics.DistributionalQCritic
  in_features: ${env.obs_action_size}
  v_min: -150.0
  v_max: 150.0
  num_atoms: 51
  features: [256, 256]
  use_layer_norm: true
  dropout_rate: 0.
  rngs:
    _target_: roxie.agents.utils.network_rngs
    seed: ${agent.hyperparams.seed}
    offset: 2

memory_config:
  _target_: flashbax.buffers.make_flat_buffer
  max_length: 500_000
  min_length: 1_000
  sample_batch_size: 512
  add_sequences: False
  add_batch_size: ${env.parallel_envs}

actor_optimizer_config:
  _target_: optax.adam
  b1: 0.9
  b2: 0.999
  eps: 1e-8
critic_optimizer_config:
  _target_: optax.adam
  b1: 0.9
  b2: 0.999
  eps: 1e-8
