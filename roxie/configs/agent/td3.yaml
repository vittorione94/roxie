name: "td3"

args:
  gamma: 0.99
  tau: 0.005
  actor_learning_rate: 3e-4
  critic_learning_rate: 3e-4
  target_policy_noise: 0.2        # TD3 default target smoothing (env-unit fraction)
  target_noise_clip: 0.5
  policy_delay: 2                 # actor + target updates every 2 critic steps
  memory_warmup: 30_000
  steps_before_learning: 30_000
  steps_between_updates: 400
  learning_steps: 100
  max_grad_norm: 1
  # Penalty on the actor's pre-tanh logits: relu(|u| - 1)^2 summed over action
  # dims, averaged over the batch. Without it the DPG objective drives the
  # logits out until tanh saturates and the actor gradient underflows to zero.
  # See DeterministicActor's saturation note.
  #
  # Watch `td3/tanh_grad` and `td3/sat_frac` to tune this: if tanh_grad drifts
  # toward 0 the coefficient is too small, if it pins near 1 (and score stalls)
  # it is too large and the policy can no longer reach the action limits.
  pre_activation_coef: 1e-1

actor:
  _target_: roxie.models.actors.DeterministicActor
  features: [256, 256]
  use_layer_norm: true
  dropout_rate: 0.
  # Small final layer (the original DDPG trick): start the logits inside
  # tanh's linear region rather than near its knee.
  output_init_scale: 0.01

critic:
  _target_: roxie.models.critics.QCritic
  features: [256, 256]
  use_layer_norm: true            # strong stabilizer against value divergence
  dropout_rate: 0.

memory:
  _target_: flashbax.buffers.make_flat_buffer
  max_length: 500_000
  min_length: 1_000
  sample_batch_size: 512
  add_sequences: False
  add_batch_size: ${env.parallel_envs}
