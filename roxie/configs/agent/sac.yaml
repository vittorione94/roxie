_target_: roxie.agents.SAC

# `cpu`, `gpu`, or null for whatever JAX picks. Independent of `env.device`:
# CPU physics with a GPU learner is a real configuration (docs/backends.md).
device: null

gamma: 0.99
tau: 0.005
actor_learning_rate: 3e-4
critic_learning_rate: 3e-4
alpha_learning_rate: 3e-4
# Entropy temperature. `auto_alpha` tunes it against `target_entropy`;
# null means the SAC default of -dim(A).
init_log_alpha: 0.0
auto_alpha: true
target_entropy: null
# Multiplies the -dim(A) default (ignored when `target_entropy` is set). The
# tanh squash makes the entropy floor a saturation ceiling, so 1.0 caps the
# policy near tanh(1) per actuator — too timid for tasks that need bang-bang
# torque, and there is no per-dim slack to trade at dim(A) = 1.
target_entropy_scale: 1.0
memory_warmup: 30_000
steps_between_updates: 400
learning_steps: 20
# TD horizon for the Bellman target. >1 swaps the flat replay buffer for a
# trajectory buffer and uses masked n-step returns.
n_step: 1
# Actor + temperature update on 1 of every `policy_delay` gradient steps; the
# critic updates on all of them. 1 = textbook SAC, and compiles without a
# branch. >1 trades policy freshness for critic updates per second.
policy_delay: 1
max_grad_norm: 1
normalize_observations: true
obs_norm_clip: 5.0
obs_norm_eps: 1e-8

actor_config:
  _target_: roxie.models.actors.StochasticActor
  features: [256, 256]
  use_layer_norm: false
  std_min: 1e-4
  std_max: 10.0

critic_config:
  _target_: roxie.models.critics.QCritic
  features: [256, 256]
  use_layer_norm: false
  dropout_rate: 0.

memory_config:
  _target_: flashbax.buffers.make_flat_buffer
  max_length: 1_000_000
  min_length: 1_000
  sample_batch_size: 256
  add_sequences: False
  add_batch_size: ${env.parallel_envs}

# Feeds `nnx.Rngs`; the actor and each critic head take distinct derived offsets
# so twin critics never start identical.
seed: 0

# `_target_` picks the optax family; the learning rate stays a top-level arg
# above so it remains swept, logged and checkpointed. For a schedule instead of
# a constant rate, give the block its own `learning_rate:` sub-block — one that
# declares it wins over the scalar arg. Swapping family from the CLI must also
# drop the kwargs the new family does not take: hydra MERGES dict overrides
# rather than replacing them.
actor_optimizer_config:
  _target_: optax.adam
  b1: 0.9
  b2: 0.999
  eps: 1e-8
critic_optimizer_config:
  _target_: optax.adam
  b1: 0.9
  b2: 0.999
  eps: 1e-8
# Entropy temperature: a single scalar, so it is NOT global-norm clipped.
alpha_optimizer_config:
  _target_: optax.adam
  b1: 0.9
  b2: 0.999
  eps: 1e-8
