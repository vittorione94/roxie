_target_: roxie.agents.TD4

# `cpu`, `gpu`, or null for whatever JAX picks. Independent of `env.device`:
# CPU physics with a GPU learner is a real configuration (docs/backends.md).
device: null

gamma: 0.99
tau: 0.005
actor_learning_rate: 3e-4
critic_learning_rate: 3e-4
target_policy_noise: 0.2        # TD3 paper's target smoothing, in the actor's [-1, 1] units
target_noise_clip: 0.5
policy_delay: 2                 # actor + target updates every 2 critic steps
n_step: 5                       # D4PG paper's N-step return horizon
# MUST bracket the achievable n-step discounted return — a support that clips
# real returns saturates the edge atoms and biases Q. Acme's control-suite
# default.
v_min: -150.0
v_max: 150.0
num_atoms: 51
memory_warmup: 30_000
steps_between_updates: 400
learning_steps: 100
max_grad_norm: 1
pre_activation_coef: 0.0   # actor pre-tanh saturation penalty; 0 = off
normalize_observations: true
obs_norm_clip: 5.0
obs_norm_eps: 1e-08

actor_config:
  _target_: roxie.models.actors.DeterministicActor
  features: [256, 256]
  use_layer_norm: true
  dropout_rate: 0.

critic_config:
  # Instantiated twice behind a TwinCritic; num_atoms is injected by the agent.
  _target_: roxie.models.critics.DistributionalQCritic
  features: [256, 256]
  use_layer_norm: true
  dropout_rate: 0.

memory_config:
  _target_: flashbax.buffers.make_flat_buffer
  max_length: 500_000
  min_length: 1_000
  sample_batch_size: 512
  add_sequences: False
  add_batch_size: ${env.parallel_envs}

# Feeds `nnx.Rngs`; the actor and each critic head take distinct derived offsets
# so twin critics never start identical.
seed: 0

# `_target_` picks the optax family; the learning rate stays a top-level arg
# above so it remains swept, logged and checkpointed. For a schedule instead of
# a constant rate, give the block its own `learning_rate:` sub-block — one that
# declares it wins over the scalar arg. Swapping family from the CLI must also
# drop the kwargs the new family does not take: hydra MERGES dict overrides
# rather than replacing them.
actor_optimizer_config:
  _target_: optax.adam
  b1: 0.9
  b2: 0.999
  eps: 1e-8
critic_optimizer_config:
  _target_: optax.adam
  b1: 0.9
  b2: 0.999
  eps: 1e-8
