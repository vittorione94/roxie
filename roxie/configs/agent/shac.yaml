_target_: roxie.agents.SHAC

hyperparams:
  _target_: roxie.agents.hyperparams.SHACHyperparams

  gamma: 0.99
  actor_learning_rate: 2e-4       # paper: shared with the world model
  critic_learning_rate: 2e-4
  max_grad_norm: 1.0
  actor_clip_value: 0.1           # element-wise, after the global-norm clip
  memory_warmup: 10_000           # fills the WORLD's buffer
  steps_between_updates: 1_000
  learning_steps: 10              # paper: 1 policy update per world update
  horizon: 32                     # H
  gae_lambda: 0.95
  imagined_batch_size: 1024       # paper: 4096 imagined rollouts per update
  critic_epochs: 5
  critic_minibatches: 4
  normalize_observations: true
  obs_norm_clip: 5.0
  obs_norm_eps: 1e-08
  seed: 0

actor_config:
  _target_: roxie.models.actors.DeterministicActor
  in_features: ${env.obs_size}
  action_dim: ${env.action_size}
  features: [256, 256]
  use_layer_norm: true
  dropout_rate: 0.
  output_init_scale: 0.01
  rngs:
    _target_: roxie.agents.utils.network_rngs
    seed: ${agent.hyperparams.seed}
    offset: 0

critic_config:
  _target_: roxie.models.critics.VCritic
  in_features: ${env.obs_size}
  features: [256, 128]            # paper: [256, 128]
  use_layer_norm: true
  rngs:
    _target_: roxie.agents.utils.network_rngs
    seed: ${agent.hyperparams.seed}
    offset: 2

actor_optimizer_config:
  _target_: optax.adam
  b1: 0.9
  b2: 0.95                        # paper: Adam(0.9, 0.95) for the policy
  eps: 1e-8
critic_optimizer_config:
  _target_: optax.adam
  b1: 0.9
  b2: 0.999
  eps: 1e-8
