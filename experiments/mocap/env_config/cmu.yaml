# @package env

config:
  # Control vs. physics timestep (n_substeps = ctrl_dt / sim_dt). ctrl_dt also
  # drives mocap-clip resampling, so it is threaded through clip loading too.
  ctrl_dt: 0.025
  sim_dt: 0.005
  episode_length: 1000
  early_termination: true
  action_scale: 1.0
  target_filter_tc: 0.03
  cyclic: false
  random_start: true
  look_ahead: 5
  reset_noise_scale: 0.001
  # Negative mining over START PHASES. Uniform random starts spend most of their
  # budget on clip regions already tracked well, while the regions that actually
  # end episodes stay under-practised — and phase 0 is the extreme case, reached
  # only by reset (never by continuation, since the clip is non-cyclic) yet
  # responsible for the worst rollouts we have measured (TD3 @910M: 1000-step
  # rollouts from mid-clip, 39 steps from frame 0).
  #
  # The env keeps a per-bin failure RATE over the clip (bins so the estimate is
  # not spread over thousands of near-identical frames) and biases reset toward
  # the bins that terminate most. Rate, not count: dying early means later
  # phases are visited less, and a raw count would mistake that for competence.
  negative_mining:
    enabled: true
    # Mixture weight against uniform. 0 = pure uniform (feature off), 1 = sample
    # ONLY from the hardest bins, which collapses coverage and lets the easy
    # regions rot. Keep well below 1 — this is a re-weighting, not a curriculum.
    alpha: 0.5
    bins: 64
    # EMA on the per-bin failure rate. The table updates once per epoch off that
    # epoch's terminations; smoothing stops one noisy epoch from dominating the
    # start distribution for the next.
    ema: 0.8
    # Frames to back up from the sampled bin, so the policy gets a run-up INTO
    # the hard region rather than being dropped at the point of failure with no
    # context. 0 = start exactly at the sampled phase.
    lead_in: 0
  # Touch-sensor normal force (newtons) above which a foot's binary
  # ground-contact obs flag reads 1. ~0 when airborne, tens of N when planted.
  foot_contact_force_thresh: 1.0
  reward_termination:
    enabled: true
    # Floor = min_tracking_frac * max_track, with max_track = 0.95 (the sum of
    # the tracking weights), so 0.5 -> 0.475 and 0.4 -> 0.380.
    #
    # Lowered from 0.5 after instrumenting terminations: once the root reward was
    # split (run 2026-08-14_19-55-11), tracking-collapse became ~77% of episode
    # ends and stayed there for 40+ epochs, while root drift fell 34% -> 21% and
    # `reward/pose` held at ~0.77. Typical `tracking` runs ~0.63 against the old
    # 0.475 floor, i.e. episodes die on DIPS rather than sustained poor tracking.
    #
    # This is as much a diagnostic as a fix: if episode length scales with this
    # number, termination strictness is what caps the run; if it does not, the
    # policy genuinely cannot sustain tracking and the reward/observation design
    # is the next place to look. Loosening a threshold does not help if failures
    # are excursions -- it only delays them.
    min_tracking_frac: 0.4
  root_termination:
    enabled: true
    max_dist: 0.25
