# @package _global_

# Shared env / trainer / logging block for the CMU_006_13 release benchmark —
# the "complex task" half of the v1 release figure. EVERY bench_<agent>.yaml
# pulls this in unchanged, so the only things that differ between runs are the
# agent (the launchable) and where the physics/learner execute (the `backend`
# group). Do NOT override a key from this file in a launchable, or the
# comparison stops being an A/B.
#
# The task: overfit ONE clip — CMU_006_13, the hard 40.8s / 1631-frame one —
# and answer "which algorithm gets furthest, per env step and per wall-clock
# hour?". A single clip rather than the 800-clip set because the release figure
# has to be reproducible on one box — at the 1B-step budget below that is a
# multi-day grid already, and the 800-clip set would make it a multi-week one.
#
# Pair it with `agent: <name>_bench`, `env_config: cmu`, `reward: cmu_tracking`
# and `backend: <cell>` — one of warp / envpool / envpool_gpu.

# Identity of this run within the release grid. `cell` comes from the backend
# group, `agent` from the launchable; both feed the hydra output dir and the
# wandb run name below.
release:
  suite: mocap_cmu_006_13
  agent: ???
  cell: ???

env:
  seed: 0
  # Held equal across every cell. The CPU pool sustains this comfortably
  # (measured 35.2k sps physics-only at 1000 envs, and throughput is near-flat
  # in the env count) so the GPU and CPU cells can share it — which is what
  # makes them comparable at all.
  parallel_envs: 1000
  # Viewer hook resolved by play.py via hydra.utils.get_method.
  viewer: examples.mocap.loader.mocap_viewer_extras
  env_name: null
  # The single clip every agent has to overfit. gpu_clip_budget 0 + clip_swap
  # false = the whole (only) clip stays resident, no reshuffling.
  clip_ids: ["CMU_006_13"]
  gpu_clip_budget: 0
  clip_swap: False
  # PD position servos. Torque motors vs position servos is a DIFFERENT TASK,
  # not a detail — it is one of the drifts check_envpool_parity.py guards.
  actuation: position
  actuation_kp_scale: 1.0
  actuation_kv_ratio: 0.0
  # Collision filter: "full" (self-collision + ground, the dm_control default),
  # "ground" (no self-contact, every geom still hits the floor) or "feet".
  # "ground" for the benchmark: the retargeted CMU reference interpenetrates its
  # own limbs, so under "full" the solver pushes the body out of the very pose
  # the tracking reward asks it to hold. This is a task definition, not a
  # performance knob.
  collisions: ground

trainer:
  # 1B env steps — the release budget. At the measured 28k sps of the warp_gpu
  # cell that is ~10 h/agent, and ~16 h on the envpool_gpu hybrid (17.2k sps);
  # the whole mocap suite is a multi-day sequential grid, not an overnight one.
  # Same budget for every agent and every cell that runs: score-vs-env-steps
  # ranks the algorithms and the wall-clock panel shows what each backend cost
  # to get there. Override for a pilot with `trainer.steps=...`; do not edit it
  # per-cell.
  #
  # ANYTHING MEASURED IN ENV STEPS IS TIED TO THIS NUMBER and has to move with
  # it. Today that is `noise/bench_gaussian.yaml`'s `decay_steps` (held at 40%
  # of the budget) plus the two cadences below. `memory_warmup` and the replay
  # capacity deliberately do NOT scale: they are matched hyperparameters shared
  # with the walker suite, so a longer budget means more turnover through the
  # same buffer, which is the intended reading.
  steps: 1_000_000_000
  # 200 points of curve. Holding 1M (the 50M-budget value) would mean 1000
  # epochs, and an epoch boundary is not free: it pauses the learner and runs
  # `test_episodes` full-clip evals. 5x fewer boundaries for resolution nobody
  # reads off a 200-point curve anyway.
  epoch_steps: 5_000_000
  # 20 checkpoints per run — enough for the weights export to pick a best from,
  # and with `replace_checkpoint: false` below they all stay. Measured size on
  # this task is 52 MB (ddpg) to 79 MB (td3, twin critics + their optimizer
  # slots), so ~1-1.6 GB per run. The 50M-budget cadence of 10M would write 100
  # per run — 5-8 GB each, ~55 GB across the grid — to publish exactly one
  # policy per agent.
  save_steps: 50_000_000
  # 4, not 100: under the canonical eval protocol (frame 0, no reset noise, run
  # the whole clip) a single-clip run makes every eval episode the SAME rollout,
  # so 96 of 100 would re-measure one start state. 4 rather than 1 only because
  # Warp's atomic contact reductions are not bit-reproducible, so a handful of
  # rollouts still shows that spread. `test/distinct_starts` reports distinct
  # CLIPS and will read 1 here. RAISE THIS on any multi-clip run.
  test_episodes: 4
  show_progress: true
  replace_checkpoint: false
  # Checkpoint the replay buffer too. Off: a checkpoint stays small and cheap to
  # write, and a run resumed with `resume=` refills the buffer through its warmup
  # before learning again. On, a resume is exact — at the cost of the buffer's
  # full size on disk per save, which is gigabytes here.
  save_buffer: false

runtime:
  # Precision of every f32 matmul, applied globally (agent networks AND MJX
  # physics), so it lives here rather than in an agent yaml — flipping it for
  # one arm would break the A/B. Measured on the RTX 5080 over a SAC gradient
  # burst (obs 700, batch 512, [1024,512,256]+LN), where ~95% of a step is GEMMs:
  #
  #   float32         1.87 ms/step   critic_loss 804.791687  (f32 reference)
  #   tensorfloat32   1.26 ms/step   critic_loss 804.758789  (rel err 4.1e-5)
  #   null (default)  2.14 ms/step   critic_loss 804.739685  (rel err 6.5e-5)
  #
  # JAX's default resolves to the bf16 path here, which is BOTH slower and less
  # accurate than tf32. On the CPU cells this is a no-op (a CPU matmul is true
  # f32 either way), so the same value is safe for all three.
  matmul_precision: tensorfloat32

logging:
  wandb:
    enabled: true
    project: roxie-release-v1
    entity: null
    name: ${release.agent}.${release.cell}
    group: ${release.suite}
    job_type: ${release.cell}
    tags: [release-v1, "${release.suite}", "${release.cell}", "${release.agent}"]
    mode: online
    # MUST stay false: `true` re-prompts interactively for the API key on every
    # run, which deadlocks an unattended overnight grid.
    relogin: false

hydra:
  run:
    dir: outputs/release_v1/${release.suite}/${release.cell}/${release.agent}/${now:%Y-%m-%d_%H-%M-%S}
