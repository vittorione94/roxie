# Exploration noise shared by every DETERMINISTIC-policy agent in the
# CMU_006_13 overfit sweep (DDPG / TD3 / TD4 / D4PG). Pinned here rather than
# selected via `/noise: gaussian` so the sweep can't drift when the global
# roxie/configs/noise/gaussian.yaml is retuned for another env.
#
# Values = the global gaussian defaults as of this sweep: the annealing schedule
# is what broke the single-clip ceiling in the 2026-07-18 probe (train episode
# length climbed monotonically while noise decayed), so keep the anneal, not a
# frozen scale.
#
# SAC / MPO / PPO have their own stochastic policies and their agents take no
# noise_config — their launchables deliberately omit this group.
_target_: roxie.exploration.noisy.GaussianNoise
initial_noise_scale: 0.4
decay_schedule:
  _target_: roxie.exploration.schedulers.LinearDecay
  decay_steps: 50_000_000
  final_value: 0.1
