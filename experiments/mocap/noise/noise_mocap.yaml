# Mocap-tracking exploration noise (OU). Self-contained mocap variant of the
# shared /noise: ou group — selected from the experiment's defaults list as
# `- noise: noise_mocap`.
#
# With the unit-variance OU normalization in roxie/exploration/noisy.py,
# `initial_noise_scale` IS the stationary per-joint noise std (in normalized
# [-1, 1] action units). Expect the logged `noise/per_joint_abs` to read
# ~0.6-0.7x this value: mean|x| is 0.78x the std, and action-bound clipping at
# tanh saturation eats another ~25%.
#
# History / rationale:
#   - scale: the 2026-06-30 baseline had the longest episodes of any run, so
#     "high noise trips the tracking termination" was wrong on the data. Its
#     "scale 0.1" ran under the OLD unnormalized OU = stationary std 1.72x scale
#     ~ 0.17, logging per_joint_abs ~0.10. In the normalized parameterization
#     that same magnitude is scale 0.17 (expect logged ~0.6x = ~0.10). The 0.05
#     phase explored at per_joint_abs ~0.029 — exploration-starved for a
#     deterministic policy: the buffer held only micro-perturbations of current
#     behaviour — and a 0.1 phase (logged ~0.057) was still only ~60% of
#     baseline exploration.
#   - theta: 2.0 with dt=ctrl_dt=0.025 gives a 1/(theta*dt) = 20-step (0.5 s)
#     correlation time — correlated dither that decays within an episode. The
#     shared config's 0.15 gave 267 steps (6.7 s), i.e. a quasi-static per-joint
#     bias inherited across episode resets (reset_noise only fires at epoch
#     boundaries). If a run at these settings walls, the clean control is
#     theta: 0.15 (scale stays 0.17) = the baseline's exact exploration
#     (std ~0.17, 6.7 s correlation) in the normalized parameterization. The
#     slow quasi-static drift may in fact BE the baseline's edge — a coherent
#     per-joint offset held for seconds is structured exploration, not noise.
#   - decay: frozen (1B steps ~ run length, high floor) while runs are killed
#     and compared at 70-150M steps — a shorter decay silently shrinks the
#     noise mid-experiment and muddies every comparison. Reintroduce a real
#     anneal only for a full-length polish run.
_target_: roxie.exploration.noisy.OrnsteinUhlenbeckNoise
initial_noise_scale: 0.3
decay_schedule:
  _target_: roxie.exploration.schedulers.LinearDecay
  decay_steps: 1_000_000_000
  final_value: 0.05
theta: 0.15
dt: 0.025
clip: 2.0
mu: 0.0
