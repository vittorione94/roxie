# Exploration noise shared by every DETERMINISTIC-policy arm of the CMU_006_13
# release benchmark (DDPG / TD3 / TD4 / D4PG). Pinned here rather than selected
# via `/noise: gaussian` so the benchmark cannot drift when the global
# roxie/configs/noise/gaussian.yaml is retuned for another env.
#
# SAC / MPO / PPO explore from their own stochastic policies and their agents
# take no `noise_config` at all — their launchables deliberately omit this
# group, and adding it to them is a launch-time error.
#
# The ANNEAL is the load-bearing part, not the scale: the 2026-07-18 single-clip
# probe showed episode length climbing monotonically under a decaying scale and
# plateauing under a frozen one — the anneal is a ceiling-raiser. `decay_steps`
# is 40% of the benchmark budget so noise reaches its floor with more than half
# the run left to exploit it. If you change trainer.steps, change this with it:
# a decay measured in env steps becomes "no anneal" at a shorter budget and "no
# exploration" at a longer one. 400M = 40% of the 1B budget in
# bench/cmu_006_13.yaml (it was 20M when that budget was 50M).
_target_: roxie.exploration.noisy.GaussianNoise
initial_noise_scale: 0.4
decay_schedule:
  _target_: roxie.exploration.schedulers.LinearDecay
  decay_steps: 400_000_000
  final_value: 0.1
