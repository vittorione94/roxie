# @package _global_

defaults:
  - agent: td3_mocap
  - noise: noise_mocap
  - env_config: cmu
  - reward: cmu_tracking
  - _self_

env:
  seed: 0
  parallel_envs: 500
  # Experiment-injected env factory + viewer hook (resolved by train.py /
  # play.py via hydra.utils.get_method), so the core loops never branch on
  # an env-type string.
  builder: examples.mocap.loader.build_mocap_env
  viewer: examples.mocap.loader.mocap_viewer_extras
  env_name: null
  list_envs: false
  clip_ids: []
  gpu_clip_budget: 0 
  # Actuation mode: "position" = PD-target servos (policy commands target
  # poses in [-1,1] of each joint's range; dm_control's tuned per-joint kp +
  # forcerange; MuJoCo runs the PD at sim rate = 200Hz local feedback).
  # "torque" = the raw dm_control motors (force = ctrl * gear) — the mode all
  # runs used up to 2026-07-16. Exploration noise semantics improve under
  # position mode: perturbed actions are coherent postures, not random forces.
  # kp_scale exists because dm_control tuned kp WITH a 30ms activation filter
  # we can't add post-compile; instead explicit rate damping kv = kv_ratio*kp
  # is baked into the servos (0.1 swept best against spine resonance).
  actuation: position
  actuation_kp_scale: 1.0
  actuation_kv_ratio: 0.1
  # When gpu_clip_budget < total clips, the trainer rotates the on-GPU subset
  # every epoch (VRAM-saving behaviour). Set clip_swap: false to PIN the initial
  # subset for the whole run instead — fixed-subset training / coverage
  # diagnostics (e.g. gpu_clip_budget=50 clip_swap=false = train on the same 50
  # clips throughout). The pick is seeded by env.seed, so a given seed always
  # selects the same subset. Ignored when the budget covers all clips.
  clip_swap: true
  # Physics backend: "jax" (MJX) or "warp" (mujoco_warp). Requires warp-lang
  # <1.13 (see pyproject); verify with `uv run python scripts/check_warp.py`.
  impl: warp
  naconmax: null
  njmax: null
  # naccdmax = GJK/EPA convex-narrowphase budget. Defaults (mujoco_warp) to the
  # full naconmax, whose EPA scratch reserves ~90MB/buffer and OOMs at high
  # parallel_envs. Only the 2 hand ellipsoids use this path (max ~2/world), so
  # build_mocap_env caps it at parallel_envs*4. null => that auto-cap.
  naccdmax: null
  # Warp CUDA-graph capture mode:
  #   WARP_STAGED_EX (default for warp): capture once on fixed staging buffers,
  #     replay every step (+ a cheap memcpy) — fast, no leak.
  #   WARP: mjx's default — recaptures a graph EVERY step under JAX; slow AND
  #     leaks host RAM (~0.25GB/1M steps), OOMs long runs. Avoid.
  #   JAX / NONE: no recapture (no leak) but run kernels eagerly — much slower
  #     for this many-kernel step. Fallback only if STAGED_EX errors.
  # Leave unset to get WARP_STAGED_EX. Ignored by impl=jax.
  graph_mode: WARP_STAGED_EX
  # Full humanoid self-collision (limbs collide with each other, not just the
  # floor). ~15 actual contacts/world but broadphase candidates peak ~48/world
  # (so naconmax auto-sizes at parallel_envs*64). Memory stays bounded by the
  # budgets. Set false for ground-only contacts.
  self_collisions: true

trainer:
  steps: 1_000_000_000
  epoch_steps: 1_000_000
  save_steps: 10_000_000
  test_episodes: 50
  show_progress: true
  replace_checkpoint: false

# Metric logging backends. Console + CSV (in the run's output dir) are always
# on. Set logging.wandb.enabled: true to also stream metrics to Weights &
# Biases (requires the `wandb` package; run `wandb login` once).
logging:
  wandb:
    enabled: false
    project: roxie
    entity: null
    name: null
    group: null
    tags: []
    mode: online   # online | offline | disabled
    # Re-prompt for the wandb API key on every run so a multi-account desktop
    # never logs to the wrong account by reusing cached credentials. Set false
    # to trust the existing login (or set WANDB_API_KEY, which also skips it).
    relogin: true

hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
