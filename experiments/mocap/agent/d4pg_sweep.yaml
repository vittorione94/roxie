# D4PG arm of the CMU_006_13 overfit sweep: single categorical critic, no
# target-policy smoothing (as in the paper), n-step returns.
#
# SWEEP INVARIANTS (see ddpg_sweep.yaml): features [1024, 512, 256] + layer
# norm, batch 512 x 128 grad steps / 8k env steps (replay ratio ~8), buffer
# 500k, warmup 30k, gamma 0.99, tau 0.005, lr 3e-4.
name: "d4pg"

args:
  gamma: 0.99
  tau: 0.005
  actor_learning_rate: 3e-4
  critic_learning_rate: 3e-4
  target_policy_noise: 0.0        # D4PG paper doesn't smooth the target policy
  target_noise_clip: 0.0
  n_step: 5
  # Task-sized categorical support (see td4_sweep.yaml for the reasoning); the
  # two distributional arms share it so their value heads are comparable.
  v_min: -10.0
  v_max: 100.0
  num_atoms: 101
  memory_warmup: 30_000
  steps_before_learning: 30_000
  steps_between_updates: 8_000
  learning_steps: 128
  max_grad_norm: 1

actor:
  _target_: roxie.models.actors.DeterministicActor
  features: [1024, 512, 256]
  use_layer_norm: true
  dropout_rate: 0.

critic:
  # num_atoms is injected by the agent from args.num_atoms — don't set it here.
  _target_: roxie.models.critics.DistributionalQCritic
  features: [1024, 512, 256]
  use_layer_norm: true
  dropout_rate: 0.

memory:
  _target_: flashbax.buffers.make_flat_buffer
  max_length: 500_000
  min_length: 10_000
  sample_batch_size: 512
  add_sequences: False
  add_batch_size: ${env.parallel_envs}
