# SAC arm of the CMU_006_13 overfit sweep: stochastic (tanh-Gaussian) policy,
# twin Q critics, auto-tuned entropy temperature. Explores from its own policy
# entropy, so its launchable carries NO noise group (the agent takes no
# noise_config).
#
# SWEEP INVARIANTS (see ddpg_sweep.yaml): features [1024, 512, 256] + layer
# norm, batch 512 x 128 grad steps / 8k env steps (replay ratio ~8), buffer
# 500k, warmup 30k, gamma 0.99, tau 0.005, lr 3e-4, n_step 5.
_target_: roxie.agents.SAC

# Every SAC.__init__ keyword appears below, so this arm is fully specified
# here rather than half-inherited from constructor defaults.
gamma: 0.99
tau: 0.005
# Matches every other arm. SAC applies the entropy bonus only at the
# bootstrap state (see sac_critic_loss_fn) — the usual n-step approximation.
n_step: 5
actor_learning_rate: 3e-4
critic_learning_rate: 3e-4
alpha_learning_rate: 3e-4
init_log_alpha: 0.0
auto_alpha: true
target_entropy: null            # null -> -dim(A) = -56
memory_warmup: 30_000
steps_before_learning: 30_000
steps_between_updates: 8_000
learning_steps: 128
# 1 = textbook SAC (actor every step), matching how this arm has always run.
# The actor+temperature block is ~39% of a gradient step, so raising this is
# the cheapest wall-clock lever on the arm: 2 -> ~1.25x, 4 -> ~1.45x fewer
# ms/grad step. It is an algorithm change (REDQ/DroQ-style), not free —
# sweep it as its own arm rather than folding it into the invariants.
policy_delay: 1
max_grad_norm: 1
normalize_observations: true
obs_norm_clip: 5.0
obs_norm_eps: 1e-8

actor_config:
  _target_: roxie.models.actors.StochasticActor
  features: [1024, 512, 256]
  use_layer_norm: true
  std_min: 1e-4
  std_max: 5.0

critic_config:
  # Instantiated twice behind a TwinCritic.
  _target_: roxie.models.critics.QCritic
  features: [1024, 512, 256]
  use_layer_norm: true
  dropout_rate: 0.

memory_config:
  _target_: flashbax.buffers.make_flat_buffer
  max_length: 500_000
  min_length: 10_000
  sample_batch_size: 512
  add_sequences: False
  add_batch_size: ${env.parallel_envs}

# Network parameter init. Feeds `nnx.Rngs`; the actor and each critic head take
# distinct derived offsets so twin critics never start identical (a clipped
# double-Q min over two identical heads buys nothing). Sweep this to separate a
# real effect from init luck.
seed: 0

# Optimizers. `_target_` picks the optax family and carries its own
# hyperparameters; the learning rate stays a top-level arg above so it remains
# swept, logged and checkpointed, and `max_grad_norm` applies the global-norm
# clip ahead of the transform (null/0 disables clipping entirely).
#
# For a schedule instead of a constant rate, give the block its own
# `learning_rate:` sub-block — a block that declares one wins over the scalar
# arg above:
#
#   actor_optimizer_config:
#     _target_: optax.adamw
#     weight_decay: 1e-4
#     learning_rate:
#       _target_: optax.cosine_decay_schedule
#       init_value: 3e-4
#       decay_steps: 1_000_000
#
# Swapping family from the CLI must also drop the kwargs the new family does
# not take -- hydra MERGES dict overrides rather than replacing them, so the
# b1/b2 below would survive into an optimizer that has no such argument:
#
#   agent.actor_optimizer_config._target_=optax.rmsprop \
#     '~agent.actor_optimizer_config.b1' '~agent.actor_optimizer_config.b2' \
#     +agent.actor_optimizer_config.decay=0.9
actor_optimizer_config:
  _target_: optax.adam
  b1: 0.9
  b2: 0.999
  eps: 1e-8
critic_optimizer_config:
  _target_: optax.adam
  b1: 0.9
  b2: 0.999
  eps: 1e-8
# Entropy temperature: a single scalar, so it is NOT global-norm clipped.
alpha_optimizer_config:
  _target_: optax.adam
  b1: 0.9
  b2: 0.999
  eps: 1e-8
