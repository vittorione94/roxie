# TD3 arm of the CMU_006_13 overfit sweep. This is the reference arm — the
# historical champion stack — so read the others against it.
#
# SWEEP INVARIANTS (see ddpg_sweep.yaml for the full list): features
# [1024, 512, 256] + layer norm, batch 512 x 128 grad steps / 8k env steps
# (replay ratio ~8), buffer 500k, warmup 30k, gamma 0.99, tau 0.005, lr 3e-4.
#
# TD3-specific: twin Q critics + delayed actor updates.
#
# 2026-08-16: this arm now also carries `pre_activation_coef` + the small
# actor output init (see below). That is a REAL delta against the other arms,
# which still run the unpenalized DPG actor loss -- the sweep is no longer a
# clean algorithm-only A/B until the same fix lands on ddpg/d4pg/td4.
name: "td3"

args:
  gamma: 0.99
  tau: 0.005
  actor_learning_rate: 3e-4
  critic_learning_rate: 3e-4
  target_policy_noise: 0.05
  target_noise_clip: 0.15
  policy_delay: 2                 # actor + target updates every 2 critic steps
  memory_warmup: 30_000
  steps_before_learning: 30_000
  steps_between_updates: 8_000
  learning_steps: 128
  n_step: 5
  max_grad_norm: 1
  # Actor saturation penalty, mean(relu(|u| - 1)^2) on the pre-tanh logits.
  # The unpenalized run of this exact arm ended with mean |u| = 9.1 and 63% of
  # action dims past |a| > 0.999 -- a bang-bang controller with a dead
  # gradient. See td3_mocap.yaml for the full diagnosis.
  pre_activation_coef: 1e-2

actor:
  _target_: roxie.models.actors.DeterministicActor
  features: [1024, 512, 256]
  use_layer_norm: true
  dropout_rate: 0.
  # Small final layer (the original DDPG trick): start the logits inside
  # tanh's linear region rather than near its knee.
  output_init_scale: 0.01

critic:
  # Instantiated twice behind a TwinCritic.
  _target_: roxie.models.critics.QCritic
  features: [1024, 512, 256]
  use_layer_norm: true            # strong stabilizer against value divergence
  dropout_rate: 0.

memory:
  _target_: flashbax.buffers.make_flat_buffer
  max_length: 500_000
  min_length: 10_000
  sample_batch_size: 512
  add_sequences: False
  add_batch_size: ${env.parallel_envs}
