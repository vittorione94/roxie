# PPO arm of the CMU_006_13 overfit sweep. The odd one out: on-policy, so there
# is no replay buffer, no warmup, no target networks and no replay ratio to
# match. Networks are still [1024, 512, 256] + layer norm so capacity stays the
# controlled variable, and the env/reward come from the same shared block.
#
# What CANNOT be equalized against the off-policy arms:
#   - sample efficiency: PPO discards each rollout after its update, so at equal
#     env steps it sees far fewer gradient-relevant samples. Compare on
#     score-vs-env-steps AND score-vs-wall-clock, and expect a different shape.
#   - the critic is a V critic (state value), not Q(s, a).
name: "ppo"

args:
  gamma: 0.99
  learning_steps: 4
  num_minibatches: 20
  actor_learning_rate: 1e-4
  critic_learning_rate: 3e-4
  target_kl: 0.15
  gae_lambda: 0.95                # GAE bias/variance trade-off (1 = Monte Carlo)
  clip_eps: 0.2                   # PPO surrogate clip range
  entropy_coef: 0.001             # entropy bonus weight in the actor loss
  max_grad_norm: 1

actor:
  _target_: roxie.models.actors.StochasticActor
  features: [1024, 512, 256]
  use_layer_norm: true
  std_min: 1e-4
  std_max: 5.0
  # Bound actions in (-1, 1) via tanh. Without it nothing keeps the policy mean
  # inside actuator_ctrlrange.
  squash: true

critic:
  _target_: roxie.models.critics.VCritic
  features: [1024, 512, 256]
  use_layer_norm: true
  dropout_rate: 0.

memory:
  # On-policy trajectory queue: one timestep per env per step (add_sequence_
  # length 1), update fires once `sample_sequence_length` steps are queued =>
  # 64 x 1000 envs = 64k transitions per update, then the queue drains.
  # sample_sequence_length must be <= max_length_time_axis (flashbax asserts).
  _target_: flashbax.buffers.make_trajectory_queue
  max_length_time_axis: 512
  add_batch_size: ${env.parallel_envs}
  add_sequence_length: 1
  sample_sequence_length: 32
