# TD3 arm of the CMU_006_13 RELEASE BENCHMARK (the "complex task" half of
# the v1 release figure). Launched by experiments/mocap/bench_td3.yaml.
#
# This set is a SIBLING of the *_sweep.yaml campaign arms, not a replacement:
# the sweep files are a live tuning campaign whose arms are mid-migration and
# therefore not mutually matched (TD3 alone carries the actor saturation
# penalty and a halved replay ratio). A release figure has to be a clean
# algorithm-only A/B, so this file is the sweep arm with exactly two campaign
# findings applied UNIFORMLY to every arm that can take them:
#
#   1. learning_steps 128 -> 64 (replay ratio ~8 -> ~4). Tested upwards three
#      times in the campaign for three nulls; the surplus gradients went into
#      value inflation, not tracking quality.
#   2. pre_activation_coef 0.0 -> 1e-1 and output_init_scale 0.01 on EVERY
#      deterministic arm. Without them the DPG objective saturates the actor's
#      tanh and the gradient underflows to zero — measured at 63% of action
#      dims past |a| > 0.999. The tell is deterministic eval scoring BELOW the
#      noisy behaviour policy.
#
# Everything else — nets [1024, 512, 256] + layer norm, buffer 500k x batch
# 512, warmup 30k, 8k-env-step update boundary, gamma/tau/lr, n_step 5 where
# supported — is unchanged from the sweep arm and identical across this set.
_target_: roxie.agents.TD3

gamma: 0.99
tau: 0.005
actor_learning_rate: 3e-4
critic_learning_rate: 3e-4
# 2026-08-16: restored to the TD3 paper's 0.2 / 0.5. At the previous
# 0.05 / 0.15 the smoothing kernel was ~4x narrower than the critic's own
# action resolution, so target policy smoothing -- the mechanism that stops
# the critic growing sharp peaks for the actor to chase -- was effectively
# off. Critic loss climbing monotonically (1.7 -> 11.9 over 17 epochs) while
# the score crawled is the signature. Watch `td3/twin_gap` and
# `td3/target_smooth_clip_frac` to confirm the smoothing is live.
target_policy_noise: 0.2
target_noise_clip: 0.5
policy_delay: 2                 # actor + target updates every 2 critic steps
memory_warmup: 30_000
steps_before_learning: 30_000
steps_between_updates: 8_000
# 2026-08-16: 128 -> 64 (replay ratio 8 -> 4). The campaign tested this lever
# UPWARDS three times and got three nulls (RR 8 -> 33 = 4x the gradients for
# no per-step gain); downwards was never tried, so the ratio was simply
# over-provisioned. It is not free wall-clock: at ~1M steps/epoch the sim
# floor is ~45s (PPO, whose learner is ~3s of work, runs 47.8s epochs on this
# exact env), so TD3's 61.7s epochs are ~17s of learner — halving it should
# land near ~53s. Corroborating evidence that the extra gradients were not
# converting: through 17 epochs `td3/q_buffer` climbed 3.2 -> 9.9 and
# `td3/twin_gap` 0.27 -> 1.11 with `test/score_per_step` pinned flat at 0.545,
# i.e. the surplus updates went into value inflation, not tracking quality.
# NEXT RUNG if this reads null: 32 (RR 2), which would put the epoch at ~49s,
# level with PPO. Watch `td3/updates_per_env_step` (0.016 -> 0.008) to confirm
# the change took, and `td3/td_abs` for the critic falling behind its target.
learning_steps: 64
n_step: 5
max_grad_norm: 1
# Actor saturation penalty on the pre-tanh logits: relu(|u| - 1)^2 summed
# over action dims, averaged over the batch. The unpenalized run of this exact
# arm ended with mean |u| = 9.1 and 63% of action dims past |a| > 0.999 -- a
# bang-bang controller with a dead gradient. See the header of this file.
#
# 2026-08-16: raised 1e-2 -> 1e-1, and the penalty's reduction was fixed to
# sum (not mean) over the 56 action dims, so the effective strength is ~560x
# what it was. At 1e-2-with-mean the checkpointed actor was STILL saturating
# -- median |u| = 2.3, 40% of dims past |a| > 0.99, median d(tanh)/du = 0.037
# -- because the penalty gradient (coef/56 * 2 * excess ~ 5e-4) only beat the
# DPG term when |dQ/da| < 0.002, and Q was ~11. The hinge was present but
# inert. Deterministic eval scoring BELOW the noisy training policy (19 vs 5)
# was the visible symptom: clipping a+noise pulls railed actions back inside,
# so training measured a softer policy than eval deployed.
pre_activation_coef: 1e-1
# Constructor defaults, surfaced here so every knob is editable from yaml.
normalize_observations: true   # running mean/std on observations
obs_norm_clip: 5.0   # clip normalized observations to +/- this
obs_norm_eps: 1e-08   # variance floor for the normalizer

actor_config:
  _target_: roxie.models.actors.DeterministicActor
  features: [1024, 512, 256]
  use_layer_norm: true
  dropout_rate: 0.
  # Small final layer (the original DDPG trick): start the logits inside
  # tanh's linear region rather than near its knee.
  output_init_scale: 0.01

critic_config:
  # Instantiated twice behind a TwinCritic.
  _target_: roxie.models.critics.QCritic
  features: [1024, 512, 256]
  use_layer_norm: true            # strong stabilizer against value divergence
  dropout_rate: 0.

memory_config:
  _target_: flashbax.buffers.make_flat_buffer
  max_length: 500_000
  min_length: 10_000
  sample_batch_size: 512
  add_sequences: False
  add_batch_size: ${env.parallel_envs}

# Network parameter init. Feeds `nnx.Rngs`; the actor and each critic head take
# distinct derived offsets so twin critics never start identical (a clipped
# double-Q min over two identical heads buys nothing). Sweep this to separate a
# real effect from init luck.
seed: 0

# Optimizers. `_target_` picks the optax family and carries its own
# hyperparameters; the learning rate stays a top-level arg above so it remains
# swept, logged and checkpointed, and `max_grad_norm` applies the global-norm
# clip ahead of the transform (null/0 disables clipping entirely).
#
# For a schedule instead of a constant rate, give the block its own
# `learning_rate:` sub-block — a block that declares one wins over the scalar
# arg above:
#
#   actor_optimizer_config:
#     _target_: optax.adamw
#     weight_decay: 1e-4
#     learning_rate:
#       _target_: optax.cosine_decay_schedule
#       init_value: 3e-4
#       decay_steps: 1_000_000
#
# Swapping family from the CLI must also drop the kwargs the new family does
# not take -- hydra MERGES dict overrides rather than replacing them, so the
# b1/b2 below would survive into an optimizer that has no such argument:
#
#   agent.actor_optimizer_config._target_=optax.rmsprop \
#     '~agent.actor_optimizer_config.b1' '~agent.actor_optimizer_config.b2' \
#     +agent.actor_optimizer_config.decay=0.9
actor_optimizer_config:
  _target_: optax.adam
  b1: 0.9
  b2: 0.999
  eps: 1e-8
critic_optimizer_config:
  _target_: optax.adam
  b1: 0.9
  b2: 0.999
  eps: 1e-8
