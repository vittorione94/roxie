# @package _global_

# CPU EnvPool-style physics backend (native MuJoCo, threaded stepping). Selected
# by a mocap launchable via defaults: [ ..., backend: envpool ]. Throughput
# saturates near the physical core count, so set parallel_envs accordingly in the
# launchable. The Warp budgets (naconmax/njmax/naccdmax, graph_mode, gpu_clip_
# budget) don't apply here and are simply omitted.
env:
  builder: examples.mocap.mocap_envpool.build_mocap_envpool_env
  impl: envpool
  # Stepping threads; null = min(parallel_envs, cpu cores), which is the right
  # default here. Measured on the 12-core/24-thread 7900X at parallel_envs=1000:
  # 24 threads beats 16 once the env count is well above the core count, because
  # mj_step releases the GIL and the SMT siblings absorb the memory stalls. Below
  # ~100 envs the extra threads only add dispatch overhead.
  num_threads: null
  # EnvPool eval pool size must equal trainer.test_episodes (see the builder
  # docstring); bind it so the two can't drift.
  test_episodes: ${trainer.test_episodes}

runtime:
  # Where the AGENT runs. "cpu" keeps the whole process off the GPU, which is
  # the point of this backend: the pool's physics is native MuJoCo, but the JAX
  # agent would still claim (and preallocate most of) the card otherwise. See
  # the `impl == "envpool"` branch in train.py for the measured throughput cost
  # of doing so; set to null to keep the agent on the GPU (CPU physics + GPU
  # learner), which is roughly 2x faster but puts ~1.4 GB back on the card.
  jax_platform: cpu
