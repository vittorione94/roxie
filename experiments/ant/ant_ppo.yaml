# @package _global_

# PPO on the dm_control quadruped ("ant") Move task. Quadruped isn't in the
# mujoco_playground registry, so this is a self-contained example env: its code
# lives under examples/ant/ and is loaded via the env.builder dotted path below
# (mirrors the mocap example). Run with:
#   python -m roxie.train --config-name ant/ant_ppo
# Switch walk->run with: env.desired_speed=5.0

defaults:
  - /agent: ppo
  - /noise: ou
  - _self_

env:
  seed: 0
  # PPO's replay queue (agent.memory.add_batch_size) is sized to 800; keep
  # parallel_envs in sync if you change it.
  parallel_envs: 800
  # Example env factory (resolved by train.py/play.py via hydra.utils.get_method),
  # so the core loops never branch on an env-type string.
  builder: examples.ant.loader.build_ant_env
  env_name: null
  list_envs: false
  xml_path: null
  clip_path: null
  # Target horizontal speed: 0.5 == walk, 5.0 == run (dm_control quadruped).
  desired_speed: 0.5
  # Episode init: random torso orientation settled under gravity (dm_control's
  # hard start). Set false for an upright spawn if PPO struggles to take off.
  random_orientation: true
  # Physics backend: "warp" (mujoco_warp) or "jax" (MJX). The builder sizes the
  # Warp contact/constraint budgets per parallel_envs; null lets it decide.
  impl: warp
  naconmax: null
  njmax: null

trainer:
  steps: 1_000_000_000
  epoch_steps: 100_000
  save_steps: 500_000
  test_episodes: 5
  show_progress: true
  replace_checkpoint: false

# Metric logging backends. Console + CSV (in the run's output dir) are always
# on. Set logging.wandb.enabled: true to also stream metrics to Weights &
# Biases (requires the `wandb` package; run `wandb login` once).
logging:
  wandb:
    enabled: false
    project: roxie
    entity: null
    name: null
    group: null
    tags: []
    mode: online   # online | offline | disabled
    # Re-prompt for the wandb API key on every run so a multi-account desktop
    # never logs to the wrong account by reusing cached credentials. Set false
    # to trust the existing login (or set WANDB_API_KEY, which also skips it).
    relogin: true

hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
