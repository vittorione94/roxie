# @package _global_
#
# WalkerWalk release benchmark — PPO arm. On-policy, GAE, V critic — NO noise group, no replay buffer. Not replay-ratio comparable with the other six.
#
#   uv run python roxie/train.py --config-name walker/bench_ppo
#   uv run python roxie/train.py --config-name walker/bench_ppo backend=mjx_cpu
#
# The agent block, the noise block (where there is one) and the whole
# bench/walker_walk block are shared VERBATIM with every other bench_*.yaml;
# agent/ppo_bench holds the only algorithmic difference. Nothing is
# overridden below on purpose — put ad-hoc tweaks on the CLI so this file
# keeps recording the benchmark condition.
#
# `backend` defaults to the headline GPU cell and is the ONE thing the
# release grid varies: scripts/run_release_benchmark.sh runs this launchable
# three times with backend=warp_gpu / mjx_gpu / mjx_cpu.
defaults:
  - agent: ppo_bench
  # bench BEFORE backend: the shared block declares release.cell as MISSING
  # and the backend group is what fills it in, so the order is load-bearing.
  - bench: walker_walk
  - backend: warp_gpu
  - _self_

release:
  agent: ppo
