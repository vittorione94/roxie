# @package _global_

# Release-grid cell 3/3: CPU physics (MJX on CPU) + CPU learner — the fully
# GPU-free cell, and the answer to "does this run at all without a card?".
#
# Deliberately MJX rather than the EnvPool pool: this is the same env class,
# same builder, same wrapper and the same trainer loop (`_run_jax`) as the two
# GPU cells, so the ONLY difference against warp_gpu/mjx_gpu is the device. The
# native-CPU-pool path is a genuinely different implementation of the task and
# is benchmarked where it earns its keep — on the mocap humanoid, whose
# `backend: envpool` cells carry the CPU-pool story (docs/backends.md).
#
# Expect this cell to be slow: MJX on CPU vmaps the traced step across 256 envs
# on 24 threads with no kernel fusion advantage. It is here to show the curve
# lands in the same place, not to compete on wall-clock. If it dominates the
# grid's runtime, lower WALKER_STEPS in scripts/run_release_benchmark.sh and
# re-run every cell at the reduced budget — never just this one, or the
# score-vs-steps comparison is no longer at matched budget.

release:
  cell: mjx_cpu

env:
  impl: jax
  naconmax: null
  njmax: null

runtime:
  # The whole process — physics AND agent — on the CPU. train.py applies this
  # via `jax.config.update("jax_platforms", ...)`, which is the only mechanism
  # that works after `import jax`; recording it here rather than passing
  # `device=cpu` on the CLI is what makes this cell reproducible from the
  # resolved config alone.
  jax_platform: cpu
  # null = JAX's default, which on CPU is true f32. `tensorfloat32` is a GPU
  # concept and buys nothing here, so the two GPU cells set it and this one
  # does not; the CPU cell is therefore the most numerically accurate of the
  # three, not the least.
  matmul_precision: null
