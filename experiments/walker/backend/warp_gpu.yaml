# @package _global_

# Release-grid cell 1/3: GPU physics (mujoco_warp) + GPU learner.
#
# The headline configuration — everything on the card, which is what the low
# thousands of parallel envs are for. Requires warp-lang <1.13; verify with
# `uv run python scripts/check_warp.py`.
#
# Carries only backend-mechanical settings. parallel_envs, the agent and the
# step budget are held identical across all three cells by
# experiments/walker/bench/walker_walk.yaml — this group is the ONLY thing that
# differs between them, which is what makes the comparison a backend A/B.

release:
  cell: warp_gpu

env:
  impl: warp
  # null keeps mujoco_playground's own upstream-tuned Warp budgets for this env.
  # The walker is small enough that the global contact arena is not a constraint
  # at 256 envs (unlike the mocap humanoid — see docs/backends.md).
  naconmax: null
  njmax: null

runtime:
  # Agent on the GPU (JAX's own choice, which is the card when one is visible).
  jax_platform: null
  # Measured on the RTX 5080: JAX's default f32 matmul resolves to the bf16
  # path, which is both slower AND less accurate than tf32 (~1.7x, rel err
  # 6.5e-5 vs 4.1e-5). Set on both GPU cells so they agree; the CPU cell leaves
  # it null because a CPU matmul is true f32 either way and tf32 is meaningless
  # there. See docs/backends.md#ordering-gotchas-env-vars-vs-jaxconfig.
  matmul_precision: tensorfloat32
