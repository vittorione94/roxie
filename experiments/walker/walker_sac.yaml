# @package _global_

# NO noise group: SAC explores from its own policy entropy (the tanh-Gaussian
# sample plus the learned temperature), so it takes no noise module. Pulling one
# in here made this config fail at launch with an unexpected `noise_config`.
defaults:
  - /agent: sac
  - _self_

env:
  seed: 0
  parallel_envs: 800
  # Env factory resolved by train.py/play.py (see hydra.utils.get_method).
  # This is also the default, so it may be omitted for playground envs.
  builder: roxie.environment.loader.build_playground_env
  env_name: WalkerWalk
  list_envs: false
  xml_path: null
  clip_path: null
  # Physics backend: "warp" (mujoco_warp) or "jax" (MJX). null naconmax/njmax
  # keeps the playground env's own Warp budgets.
  impl: warp
  naconmax: null
  njmax: null

runtime:
  # Precision of every f32 matmul, applied globally (agent networks AND MJX
  # physics). null leaves JAX's default. "tensorfloat32" measured ~1.7x faster
  # than the default on the RTX 5080 *and* closer to the f32 reference — see the
  # numbers in experiments/mocap/sweep/overfit_cmu_006_13.yaml.
  matmul_precision: null

trainer:
  steps: 1_000_000_000
  epoch_steps: 100_000
  save_steps: 500_000
  test_episodes: 5
  show_progress: true
  replace_checkpoint: false

# Metric logging backends. Console + CSV (in the run's output dir) are always
# on. Set logging.wandb.enabled: true to also stream metrics to Weights &
# Biases (requires the `wandb` package; run `wandb login` once).
logging:
  wandb:
    enabled: false
    project: roxie
    entity: null
    name: null
    group: null
    tags: []
    mode: online   # online | offline | disabled
    # Re-prompt for the wandb API key on every run so a multi-account desktop
    # never logs to the wrong account by reusing cached credentials. Set false
    # to trust the existing login (or set WANDB_API_KEY, which also skips it).
    relogin: true

hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
