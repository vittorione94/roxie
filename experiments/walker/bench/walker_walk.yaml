# @package _global_

# Shared env / trainer / logging block for the WalkerWalk release benchmark —
# the "simple task" half of the v1 release figure. EVERY bench_<agent>.yaml
# pulls this in unchanged, so the only things that differ between runs are the
# agent (the launchable) and where the physics/learner execute (the `backend`
# group). Do NOT override a key from this file in a launchable, or the
# comparison stops being an A/B.
#
# Pair it with `agent: <name>_bench` (matched hyperparameters, see
# experiments/walker/agent/ddpg_bench.yaml for the invariant list), and
# `backend: <cell>` — one of warp_gpu / mjx_gpu / mjx_cpu.
#
# Budget note: `trainer.steps` is the SAME for every agent and every backend
# cell, which is the point — score-vs-env-steps ranks the algorithms, and the
# wall-clock panel then shows honestly what each backend cost to get there.
# Override it for a pilot with `trainer.steps=...` on the CLI; do not edit it
# per-cell.

# Identity of this run within the release grid. `cell` comes from the backend
# group, `agent` from the launchable; both are consumed by the hydra output dir
# and the wandb run name below, so a grid of 21 runs lands in a predictable
# tree and report.
release:
  suite: walker_walk
  agent: ???
  cell: ???

env:
  seed: 0
  # Held equal across all three cells. This is a data-collection AND a replay-
  # ratio quantity (the trainer advances `steps` by parallel_envs per iteration
  # and `agent.steps_between_updates` is expressed in env steps), so moving it
  # for one cell would change the algorithm's update schedule, not just its
  # throughput. 256 is the largest count the MJX-on-CPU cell can carry without
  # dominating the wall-clock budget.
  parallel_envs: 256
  # Env factory resolved by train.py/play.py via hydra.utils.get_method.
  builder: roxie.environment.loader.build_playground_env
  env_name: WalkerWalk
  list_envs: false
  xml_path: null
  clip_path: null
  # impl / Warp budgets come from the `backend` group — that is the whole
  # variable under test here, so it must not be pinned in this file.

trainer:
  steps: 5_000_000
  # 50 points on the learning curve. Also the eval cadence: every epoch runs
  # `test_episodes` deterministic rollouts and logs test/score.
  epoch_steps: 100_000
  save_steps: 5_000_000
  # 10 (not the walker default 5): eval starts are stochastic here, so this is
  # a sample size, and the release figure quotes back-half mean +- std.
  test_episodes: 10
  show_progress: true
  replace_checkpoint: false
  # Checkpoint the replay buffer too. Off: a checkpoint stays small and cheap to
  # write, and a run resumed with `resume=` refills the buffer through its warmup
  # before learning again. On, a resume is exact — at the cost of the buffer's
  # full size on disk per save, which is gigabytes here.
  save_buffer: false

# Metric logging. Console + CSV (log.csv in the run's output dir) are always on
# — the CSV is what roxie/plot.py reads for the offline figure. wandb is on for
# the release grid so roxie/report.py can assemble the report from it.
logging:
  wandb:
    enabled: true
    project: roxie-release-v1
    entity: null
    # One run per (agent, cell); `group` collects the whole task and `job_type`
    # the backend cell, which is exactly the split the generated report uses.
    name: ${release.agent}.${release.cell}
    group: ${release.suite}
    job_type: ${release.cell}
    tags: [release-v1, "${release.suite}", "${release.cell}", "${release.agent}"]
    mode: online
    # MUST stay false for the release grid: `true` re-prompts interactively for
    # the API key on every run, which deadlocks an unattended overnight sweep.
    # Set WANDB_API_KEY (scripts/run_release_benchmark.sh checks for a login)
    # if the cached netrc credential is not the account you want.
    relogin: false

hydra:
  run:
    dir: outputs/release_v1/${release.suite}/${release.cell}/${release.agent}/${now:%Y-%m-%d_%H-%M-%S}
