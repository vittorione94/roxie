# @package _global_

defaults:
  - /agent: tdmpc
  - /noise: gaussian
  - _self_

env:
  seed: 0
  # Far fewer envs than the DDPG-family configs run: every env step costs a full
  # MPPI search (num_samples x num_iterations latent rollouts), so acting — not
  # learning — is the bottleneck here. Raise only after profiling.
  parallel_envs: 32
  builder: roxie.environment.loader.build_playground_env
  env_name: WalkerWalk
  list_envs: false
  xml_path: null
  clip_path: null
  impl: warp
  naconmax: null
  njmax: null

agent:
  args:
    # TD-MPC is designed around roughly one gradient step per env step; with 32
    # parallel envs that means a burst every step rather than the sparse,
    # large bursts the off-policy configs here use.
    memory_warmup: 5_000
    steps_before_learning: 5_000
    steps_between_updates: 32
    learning_steps: 8

trainer:
  steps: 5_000_000
  epoch_steps: 50_000
  save_steps: 500_000
  test_episodes: 5
  show_progress: true
  replace_checkpoint: false
  # Must stay false: the async learner hands the acting thread an actor-only
  # snapshot, but planning also reads the world model. See TDMPC's docstring.
  async_learner: false

logging:
  wandb:
    enabled: false
    project: roxie
    entity: null
    name: null
    group: null
    tags: []
    mode: online
    relogin: true

hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
