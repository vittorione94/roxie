# @package _global_

# TD3 on HalfCheetah-v4 via EnvPool (CPU training path).
#
# This experiment uses EnvPool instead of MuJoCo Playground / MJX, so it runs
# entirely on CPU without requiring a GPU or the Warp backend. EnvPool's C++
# implementation vectorizes the environments internally; no jax.vmap is needed
# for the env step.
#
# Run with:
#   python -m roxie.train --config-name envpool/halfcheetah_td3
#
# Switch environment:
#   python -m roxie.train --config-name envpool/halfcheetah_td3 env.task_id=Ant-v4
#
# Tune parallelism (more envs = faster data collection, more RAM):
#   python -m roxie.train --config-name envpool/halfcheetah_td3 env.parallel_envs=64
#
# GPU note: if a GPU is present and JAX sees it, the agent (actor/critic/
# optimizer) will still run on GPU while the env step stays on CPU. To force
# pure CPU: prepend `device=cpu` on the command line.

defaults:
  - /agent: td3
  - /noise: gaussian
  - _self_

env:
  seed: 0
  # EnvPool task identifier — any gymnasium-compatible envpool env works here.
  task_id: HalfCheetah-v4
  # Number of parallel training environments (EnvPool vectorizes in C++).
  parallel_envs: 32
  # Must match trainer.test_episodes: determines the size of the eval pool.
  test_episodes: 5
  # Episode time-limit (passed to envpool.make as max_episode_steps).
  max_episode_steps: 1000
  # Builder: resolves to roxie.environment.envpool_adapter.build_envpool_env,
  # which creates two independent envpool pools (train + eval).
  builder: roxie.environment.envpool_adapter.build_envpool_env

trainer:
  steps: 3_000_000
  epoch_steps: 10_000
  save_steps: 500_000
  test_episodes: 5
  show_progress: true
  replace_checkpoint: false

logging:
  wandb:
    enabled: false
    project: roxie
    entity: null
    name: null
    group: null
    tags: []
    mode: online
    relogin: true

hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
