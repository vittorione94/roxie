# Exploration noise for every DETERMINISTIC-policy arm of the release benchmark
# (DDPG / TD3 / TD4 / D4PG). Pinned here rather than selected via
# `/noise: gaussian` so the benchmark cannot drift when the global
# roxie/configs/noise/gaussian.yaml is retuned for another env.
#
# SAC / MPO / PPO explore from their own stochastic policies and take no
# `noise_config` at all; adding this group to them is a launch-time error.
#
# `decay_steps` is 40% of the benchmark budget, so noise reaches its floor with
# more than half the run left to exploit it. A decay measured in env steps
# silently becomes "no anneal" at a shorter budget and "no exploration" at a
# longer one — tests/test_release_weights.py fails when the ratio drifts.
#
# One scale for 25 tasks is deliberate: per-task tuning would make the grid a
# tuning result rather than an algorithm comparison.
_target_: roxie.exploration.noisy.GaussianNoise
initial_noise_scale: 0.4
decay_schedule:
  _target_: roxie.exploration.schedulers.LinearDecay
  decay_steps: 200_000_000
  final_value: 0.1
