# @package _global_
#
# dm_control release benchmark — MPO arm. Gaussian policy, E-step sampling + KL duals — NO noise group. ~20x more expensive per gradient step than the deterministic arms (20 action samples per state).
#
#   uv run python roxie/train.py --config-name dmc/bench_mpo
#   uv run python roxie/train.py --config-name dmc/bench_mpo release.task=CheetahRun
#   uv run python roxie/train.py --config-name dmc/bench_mpo dmc/backend@backend=envpool_cpu
#
# Everything except agent/mpo_bench is shared VERBATIM with every other
# bench_*.yaml, and nothing is overridden below on purpose — put ad-hoc tweaks
# on the CLI so this file keeps recording the benchmark condition. The grid
# varies `release.task` and the `backend` group over it, neither of them a file.
defaults:
  - agent: mpo_bench
  # bench BEFORE backend: the shared block declares release.cell as MISSING
  # and the backend group is what fills it in, so the order is load-bearing.
  - bench: dmc
  - backend: warp_gpu
  - _self_

release:
  agent: mpo
