# @package _global_
#
# dm_control release benchmark — SAC arm. Stochastic policy, twin Q, auto-tuned entropy — NO noise group: SAC explores from its own policy entropy and its agent takes no noise_config.
#
#   uv run python roxie/train.py --config-name dmc/bench_sac
#   uv run python roxie/train.py --config-name dmc/bench_sac release.task=CheetahRun
#   uv run python roxie/train.py --config-name dmc/bench_sac dmc/backend@backend=envpool_cpu
#
# Everything except agent/sac_bench is shared VERBATIM with every other
# bench_*.yaml, and nothing is overridden below on purpose — put ad-hoc tweaks
# on the CLI so this file keeps recording the benchmark condition. The grid
# varies `release.task` and the `backend` group over it, neither of them a file.
defaults:
  - agent: sac_bench
  # bench BEFORE backend: the shared block declares release.cell as MISSING
  # and the backend group is what fills it in, so the order is load-bearing.
  - bench: dmc
  - backend: warp_gpu
  - _self_

release:
  agent: sac
