# DDPG arm of the dm_control release benchmark. This file is the reference for
# the whole set: the other six agents repeat these values and only deviate where
# the ALGORITHM demands it.
#
# ONE SETTING FOR 25 TASKS. Nothing below is tuned per task: the grid ranks
# algorithms at matched hyperparameters, so a task where an arm needs a
# different lr or a wider net is one where it scores badly and says so.
#
# BENCHMARK INVARIANTS — identical in every `*_bench.yaml` here:
#   networks      actor + critic MLP [256, 256], layer norm on
#   optimisation  adam, lr 3e-4 (actor and critic), global grad-norm clip 1
#   targets       gamma 0.99, tau 0.005
#   replay        flat buffer 500k, min 10k, batch 512
#   warmup        memory_warmup 30_720 = steps_before_learning 30_720
#   schedule      steps_between_updates 2_048 env steps x learning_steps 20
#                 grad steps at batch 512  =>  replay ratio 5.0. Both are
#                 multiples of parallel_envs 256, which is why the warmup is
#                 30_720 (= 120 x 256) and not a round 30k: the trainer advances
#                 `steps` in strides of parallel_envs.
#   returns       n_step 5 wherever the agent takes it (MPO/PPO do not)
#   init          seed 0
#   obs           running normalization on, clip 5.0
#
# What is allowed to differ, because it IS the algorithm: critic count and type,
# policy delay, target-policy smoothing, exploration source, and — for PPO — the
# entire on-policy replacement of the buffer. Each file calls out its own delta.
_target_: roxie.agents.DDPG

# Where the agent runs; the `backend` group sets it per cell (see env.device).
device: null

gamma: 0.99
tau: 0.005
actor_learning_rate: 3e-4
critic_learning_rate: 3e-4
# DDPG proper: no target-policy smoothing (that is TD3's contribution, and it
# is what the td3_bench arm adds on top of this file).
target_policy_noise: 0.0
target_noise_clip: 0.0
memory_warmup: 30_720
steps_before_learning: 30_720
steps_between_updates: 2_048
learning_steps: 20
n_step: 5
max_grad_norm: 1
# Penalty on the actor's pre-tanh logits: relu(|u| - 1)^2 summed over action
# dims. Without it the DPG objective can drive the logits outward until tanh
# saturates and the actor gradient underflows to zero — a bang-bang controller
# that cannot be updated. OFF here: dm_control shows none of that failure mode
# (`td3/sat_frac` 0.002, `td3/tanh_grad` 0.6 across a full 500M-step run), and
# the penalty cost TD3 half its score. Turn it back on only with those two
# diagnostics saying so, and then for every deterministic arm at once — which is
# now checkable per arm, since each reports its own `<agent>/sat_frac` and
# `<agent>/tanh_grad` rather than TD3's standing in for all four.
pre_activation_coef: 0.0
normalize_observations: true
obs_norm_clip: 5.0
obs_norm_eps: 1e-08

actor_config:
  _target_: roxie.models.actors.DeterministicActor
  features: [256, 256]
  use_layer_norm: true
  dropout_rate: 0.
  # Small final layer (the original DDPG trick): start the logits inside tanh's
  # linear region rather than near its knee.
  output_init_scale: 0.01

critic_config:
  _target_: roxie.models.critics.QCritic
  features: [256, 256]
  use_layer_norm: true
  dropout_rate: 0.

memory_config:
  # n_step > 1 switches this to a trajectory buffer internally
  # (sample_sequence_length = n_step + 1); the flat-buffer schema is kept either
  # way and max_length/min_length stay TOTAL transitions.
  _target_: flashbax.buffers.make_flat_buffer
  max_length: 500_000
  min_length: 10_000
  sample_batch_size: 512
  add_sequences: False
  add_batch_size: ${env.parallel_envs}

# Held at 0 across the benchmark — a single seed is a demonstration, not a
# significance claim, which is why the figure quotes back-half mean +- std over
# epochs rather than a peak.
seed: 0

actor_optimizer_config:
  _target_: optax.adam
  b1: 0.9
  b2: 0.999
  eps: 1e-8
critic_optimizer_config:
  _target_: optax.adam
  b1: 0.9
  b2: 0.999
  eps: 1e-8
