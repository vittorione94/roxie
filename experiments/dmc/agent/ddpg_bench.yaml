# DDPG arm of the dm_control release benchmark. This file is the reference for
# the whole set: the other six agents repeat these values and only deviate where
# the ALGORITHM demands it.
#
# ONE SETTING FOR 25 TASKS. Nothing below is tuned per task, and that is the
# point: the grid ranks algorithms at matched hyperparameters, so a task where
# an arm needs a different lr or a wider net is one where it scores badly and
# says so. Per-task tuning would turn the figure into a tuning result.
#
# BENCHMARK INVARIANTS — identical in every `*_bench.yaml` here:
#   networks      actor + critic MLP [256, 256], layer norm on
#   optimisation  adam, lr 3e-4 (actor and critic), global grad-norm clip 1
#   targets       gamma 0.99, tau 0.005
#   replay        flat buffer 500k, min 10k, batch 512
#   warmup        memory_warmup 30_720 = steps_before_learning 30_720
#   schedule      steps_between_updates 2_048 env steps x learning_steps 20
#                 grad steps at batch 512  =>  replay ratio 5.0, and ~488k
#                 gradient steps over the 50M-step budget. 2_048 is 8 trainer
#                 iterations at parallel_envs 256; keep it a multiple of the env
#                 count or the update boundary silently rounds up to one.
#
#                 BOTH numbers are multiples of parallel_envs 256, and 30_720
#                 (= 120 x 256) is why the warmup figure is not a round 30k. The
#                 trainer advances `steps` in strides of parallel_envs, so an
#                 unaligned OFFSET used to disarm the schedule outright: at
#                 30_000 the v1 release grid ran all six off-policy arms for 5M
#                 env steps at ZERO gradient steps. `Agent.due_for_update` no
#                 longer depends on that alignment, so this is now only about
#                 warmup landing on an iteration boundary rather than 48 steps
#                 past one — but keep the multiples anyway, they are free.
#   returns       n_step 5 wherever the agent takes it (MPO/PPO do not)
#   init          seed 0
#   obs           running normalization on, clip 5.0
#
# What is allowed to differ, because it IS the algorithm: critic count and type
# (single Q / twin Q / categorical), policy delay, target-policy smoothing,
# exploration source, and — for PPO — the entire on-policy replacement of the
# buffer. Those deltas are called out at the top of each file.
#
# Unlike experiments/mocap/agent/*_sweep.yaml (which is mid-migration and has a
# TD3 arm carrying knobs the others lack), every deterministic arm here runs the
# SAME `pre_activation_coef`, so this set is a clean algorithm-only A/B.
_target_: roxie.agents.DDPG

gamma: 0.99
tau: 0.005
actor_learning_rate: 3e-4
critic_learning_rate: 3e-4
# DDPG proper: no target-policy smoothing (that is TD3's contribution, and it
# is what the td3_bench arm adds on top of this file).
target_policy_noise: 0.0
target_noise_clip: 0.0
memory_warmup: 30_720
steps_before_learning: 30_720
steps_between_updates: 2_048
learning_steps: 20
n_step: 5
max_grad_norm: 1
# Penalty on the actor's pre-tanh logits: relu(|u| - 1)^2 summed over action
# dims, averaged over the batch. Without it the DPG objective drives the logits
# outward until tanh saturates and the actor gradient underflows to zero — a
# bang-bang controller that cannot be updated. Diagnosed on the mocap sweep
# (mean |u| = 9.1, 63% of dims past |a| > 0.999); the tell is deterministic eval
# scoring BELOW the noisy behaviour policy. Every deterministic arm in this
# benchmark carries the same coefficient.
pre_activation_coef: 1e-1
normalize_observations: true
obs_norm_clip: 5.0
obs_norm_eps: 1e-08

actor_config:
  _target_: roxie.models.actors.DeterministicActor
  features: [256, 256]
  use_layer_norm: true
  dropout_rate: 0.
  # Small final layer (the original DDPG trick): start the logits inside tanh's
  # linear region rather than near its knee.
  output_init_scale: 0.01

critic_config:
  _target_: roxie.models.critics.QCritic
  features: [256, 256]
  use_layer_norm: true
  dropout_rate: 0.

memory_config:
  # n_step > 1 switches this to a trajectory buffer internally
  # (sample_sequence_length = n_step + 1); the flat-buffer schema is kept either
  # way and max_length/min_length stay TOTAL transitions.
  _target_: flashbax.buffers.make_flat_buffer
  max_length: 500_000
  min_length: 10_000
  sample_batch_size: 512
  add_sequences: False
  add_batch_size: ${env.parallel_envs}

# Feeds `nnx.Rngs`; actor and each critic head take distinct derived offsets.
# Held at 0 across the benchmark — a single seed is a demonstration, not a
# significance claim, which is why the figure quotes back-half mean +- std over
# epochs rather than a peak.
seed: 0

actor_optimizer_config:
  _target_: optax.adam
  b1: 0.9
  b2: 0.999
  eps: 1e-8
critic_optimizer_config:
  _target_: optax.adam
  b1: 0.9
  b2: 0.999
  eps: 1e-8
