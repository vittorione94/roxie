# TD3 arm of the dm_control release benchmark.
#
# ddpg_bench.yaml is the reference file and lists the invariants held identical
# across every arm (nets [256, 256] + layer norm, adam 3e-4, gamma 0.99, tau
# 0.005, buffer 500k x batch 512, warmup 30k, 2_048 env steps x 20 grad steps
# => replay ratio 5.0, n_step 5, seed 0).
#
# TD3-specific, and the whole of the delta against DDPG:
#   - twin Q critics, target = min over the pair (clipped double-Q)
#   - delayed actor + target updates (policy_delay 2)
#   - target policy smoothing at the paper's 0.2 / 0.5
_target_: roxie.agents.TD3

gamma: 0.99
tau: 0.005
actor_learning_rate: 3e-4
critic_learning_rate: 3e-4
# The TD3 paper's values. Smoothing is the mechanism that stops the critic
# growing sharp action-space peaks for the actor to chase; a kernel much
# narrower than the critic's own action resolution turns it off in all but
# name, whose signature is critic loss climbing monotonically while the score
# crawls. Watch `td3/twin_gap` and `td3/target_smooth_clip_frac`.
target_policy_noise: 0.2
target_noise_clip: 0.5
policy_delay: 2
memory_warmup: 30_720
steps_before_learning: 30_720
steps_between_updates: 2_048
learning_steps: 20
n_step: 5
max_grad_norm: 1
# See ddpg_bench.yaml. Watch `td3/tanh_grad` (healthy ~0.6, collapse < 0.05)
# and `td3/sat_frac` rather than the score to tell whether this is doing its
# job — the score moves too late to be a diagnostic.
pre_activation_coef: 1e-1
normalize_observations: true
obs_norm_clip: 5.0
obs_norm_eps: 1e-08

actor_config:
  _target_: roxie.models.actors.DeterministicActor
  features: [256, 256]
  use_layer_norm: true
  dropout_rate: 0.
  output_init_scale: 0.01

critic_config:
  # Instantiated twice behind a TwinCritic — per-network width is what is
  # equalized across the benchmark, not total parameter count, because twin vs
  # single critic IS the algorithm.
  _target_: roxie.models.critics.QCritic
  features: [256, 256]
  use_layer_norm: true
  dropout_rate: 0.

memory_config:
  _target_: flashbax.buffers.make_flat_buffer
  max_length: 500_000
  min_length: 10_000
  sample_batch_size: 512
  add_sequences: False
  add_batch_size: ${env.parallel_envs}

seed: 0

actor_optimizer_config:
  _target_: optax.adam
  b1: 0.9
  b2: 0.999
  eps: 1e-8
critic_optimizer_config:
  _target_: optax.adam
  b1: 0.9
  b2: 0.999
  eps: 1e-8
