# TD4 arm of the dm_control release benchmark: TWIN categorical critics plus
# TD3's delayed actor updates — i.e. d4pg_bench + the two TD3 ingredients.
#
# ddpg_bench.yaml is the reference file and lists the invariants held identical
# across every arm. The categorical support matches d4pg_bench exactly so the
# two distributional arms differ only in critic count and policy delay, which
# is the comparison this arm exists to make.
_target_: roxie.agents.TD4

gamma: 0.99
tau: 0.005
actor_learning_rate: 3e-4
critic_learning_rate: 3e-4
# TD3's target smoothing, unlike the D4PG arm which follows its paper and runs
# without it.
target_policy_noise: 0.2
target_noise_clip: 0.5
policy_delay: 2
n_step: 5
v_min: -5.0
v_max: 120.0
num_atoms: 101
memory_warmup: 30_720
steps_before_learning: 30_720
steps_between_updates: 2_048
learning_steps: 20
max_grad_norm: 1
pre_activation_coef: 1e-1       # see ddpg_bench.yaml
normalize_observations: true
obs_norm_clip: 5.0
obs_norm_eps: 1e-08

actor_config:
  _target_: roxie.models.actors.DeterministicActor
  features: [256, 256]
  use_layer_norm: true
  dropout_rate: 0.
  output_init_scale: 0.01

critic_config:
  # Instantiated twice; num_atoms is injected by the agent.
  _target_: roxie.models.critics.DistributionalQCritic
  features: [256, 256]
  use_layer_norm: true
  dropout_rate: 0.

memory_config:
  _target_: flashbax.buffers.make_flat_buffer
  max_length: 500_000
  min_length: 10_000
  sample_batch_size: 512
  add_sequences: False
  add_batch_size: ${env.parallel_envs}

seed: 0

actor_optimizer_config:
  _target_: optax.adam
  b1: 0.9
  b2: 0.999
  eps: 1e-8
critic_optimizer_config:
  _target_: optax.adam
  b1: 0.9
  b2: 0.999
  eps: 1e-8
