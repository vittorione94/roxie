# SAC arm of the dm_control release benchmark: stochastic (tanh-Gaussian)
# policy, twin Q critics, auto-tuned entropy temperature.
#
# ddpg_bench.yaml is the reference file and lists the invariants held identical
# across every arm.
#
# SAC-specific: it explores from its own policy entropy, so its launchable
# carries NO noise group and passing one is a launch-time error. The entropy
# bonus is applied at the bootstrap state only, the usual n-step approximation.
_target_: roxie.agents.SAC

# Where the agent runs; the `backend` group sets it per cell (see env.device).
device: null

gamma: 0.99
tau: 0.005
n_step: 5
actor_learning_rate: 3e-4
critic_learning_rate: 3e-4
alpha_learning_rate: 3e-4
init_log_alpha: 0.0
auto_alpha: true
target_entropy: null            # null -> -target_entropy_scale * dim(A)
# The tanh squash turns the entropy floor into a saturation ceiling: at scale
# 1.0 the policy cannot hold the target AND rail its actions, which pins the
# pre-tanh mean near 1.0. That costs nothing on tasks solved by mid-range
# torque and is fatal on the ones that need bang-bang (AcrobotSwingup: SAC flat
# at ~50 for 100M+ steps while the deterministic arms drift out to pre_act_abs
# 4.0 and reach ~500). 3.0 permits E|a| ~ 0.97 while still costing entropy.
#
# Measured, 1-D tanh-squashed Gaussian, best E|a| the entropy floor allows:
#   scale 1.0 -> 0.856   scale 3.0 -> 0.980   scale 5.0 -> 0.997
# The 2026-09-05 AcrobotSwingupSparse run sat exactly on the scale-1.0
# optimum (entropy -1.000, pre_act_abs 1.0-1.8) and scored 3.7 against DDPG's
# 378, never finding reward at all (q_buffer ~ 0.02).
target_entropy_scale: 3.0
memory_warmup: 30_720
steps_between_updates: 2_048
learning_steps: 20
# 1 = textbook SAC. Raising it is an algorithm change (REDQ/DroQ-style), not a
# free wall-clock win, so it would be its own arm.
policy_delay: 1
max_grad_norm: 1
normalize_observations: true
obs_norm_clip: 5.0
obs_norm_eps: 1e-8

actor_config:
  # Layer norm ON to match the rest of the benchmark (the library sac.yaml
  # leaves it off).
  _target_: roxie.models.actors.StochasticActor
  features: [256, 256]
  use_layer_norm: true
  std_min: 1e-4
  std_max: 5.0

critic_config:
  # Instantiated twice behind a TwinCritic.
  _target_: roxie.models.critics.QCritic
  features: [256, 256]
  use_layer_norm: true
  dropout_rate: 0.

memory_config:
  _target_: flashbax.buffers.make_flat_buffer
  max_length: 500_000
  min_length: 10_000
  sample_batch_size: 512
  add_sequences: False
  add_batch_size: ${env.parallel_envs}

seed: 0

actor_optimizer_config:
  _target_: optax.adam
  b1: 0.9
  b2: 0.999
  eps: 1e-8
critic_optimizer_config:
  _target_: optax.adam
  b1: 0.9
  b2: 0.999
  eps: 1e-8
# Entropy temperature: a single scalar, so it is NOT global-norm clipped.
alpha_optimizer_config:
  _target_: optax.adam
  b1: 0.9
  b2: 0.999
  eps: 1e-8
