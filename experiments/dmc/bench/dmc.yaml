# @package _global_

# Shared env / trainer / logging block for the v1 release benchmark: the whole
# dm_control suite, every agent, on both physics implementations.
#
# EVERY bench_<agent>.yaml pulls this in unchanged, so the only things that
# differ between runs are the agent (the launchable), the task (`release.task`)
# and where the physics runs (the `backend` group). Do NOT override a key from
# this file in a launchable, or the comparison stops being an A/B.
#
#   uv run python roxie/train.py --config-name dmc/bench_td3 release.task=CheetahRun
#   uv run python roxie/train.py --config-name dmc/bench_td3 release.task=CheetahRun \
#       dmc/backend@backend=envpool_cpu

# `task` is the env (and the wandb project), `cell` comes from the backend
# group, `agent` from the launchable. All three feed the hydra output dir and
# the wandb run identity.
release:
  grid: release-v1
  # Default so a bare `--config-name dmc/bench_td3` still runs something; the
  # grid always passes this explicitly.
  task: WalkerWalk
  agent: ???
  cell: ???

env:
  seed: 0
  # Held equal across both cells: this is a replay-ratio quantity as well as a
  # data-collection one, so moving it for one cell would change the update
  # schedule, not just the throughput.
  parallel_envs: 256
  # null = take each task's own declared episode length, so the two backends can
  # only ever agree by construction.
  max_episode_steps: null
  # `_target_` and the env-naming key it reads (`env_name` for playground,
  # `task_id` for envpool) come from the `backend` group — that IS the variable
  # under test, so it must not be pinned here.

trainer:
  # ANYTHING MEASURED IN ENV STEPS IS TIED TO THIS NUMBER and has to move with
  # it: today `noise/bench_gaussian.yaml`'s `decay_steps` (40% of the budget)
  # plus the two cadences below. `memory_warmup` and the replay capacity
  # deliberately do NOT scale — they are matched hyperparameters.
  # tests/test_release_weights.py pins both relationships, and
  # scripts/run_release_benchmark.sh reads the budget from here.
  steps: 500_000_000
  # 100 points on the learning curve, and the eval cadence: every epoch pauses
  # the learner and runs `test_episodes` deterministic rollouts.
  epoch_steps: 500_000
  # 10 checkpoints per run for the weights export to pick a best from.
  save_steps: 5_000_000
  # dm_control resets are stochastic, so this is a sample size.
  test_episodes: 10
  show_progress: true
  replace_checkpoint: false
  # On, a resume is exact, at the cost of the buffer's full size on disk per
  # save — gigabytes here.
  save_buffer: false

# No `runtime:` block and no `agent.device`/`env.device` on purpose: hardware
# placement and `matmul_precision` belong to the backend group, and this file is
# what is held identical across it.

logging:
  # Console + CSV are always on; roxie/plot.py reads the CSV for the offline
  # grid figure and roxie/report.py assembles the report from wandb.
  wandb:
    enabled: true
    # ONE PROJECT PER ENV, so the runs inside a project are exactly the ones
    # directly comparable: same task, same budget, 7 agents x 2 cells.
    project: roxie-${release.task}
    entity: null
    name: ${release.agent}.${release.cell}
    # What roxie/report.py selects on, and what tells a re-run apart.
    group: ${release.grid}
    job_type: ${release.cell}
    mode: online
    # MUST stay false for the grid: `true` re-prompts interactively for the API
    # key on every run, which deadlocks an unattended sweep.
    relogin: false

hydra:
  run:
    dir: outputs/release_v1/${release.task}/${release.cell}/${release.agent}/${now:%Y-%m-%d_%H-%M-%S}
