# @package _global_
#
# dm_control release benchmark — TD3 arm. DDPG + twin critics, delayed actor, target smoothing.
#
#   uv run python roxie/train.py --config-name dmc/bench_td3
#   uv run python roxie/train.py --config-name dmc/bench_td3 release.task=CheetahRun
#   uv run python roxie/train.py --config-name dmc/bench_td3 dmc/backend@backend=envpool_cpu
#
# Everything except agent/td3_bench is shared VERBATIM with every other
# bench_*.yaml, and nothing is overridden below on purpose — put ad-hoc tweaks
# on the CLI so this file keeps recording the benchmark condition. The grid
# varies `release.task` and the `backend` group over it, neither of them a file.
defaults:
  - agent: td3_bench
  - noise: bench_gaussian
  # bench BEFORE backend: the shared block declares release.cell as MISSING
  # and the backend group is what fills it in, so the order is load-bearing.
  - bench: dmc
  - backend: warp_gpu
  - _self_

release:
  agent: td3
