# @package _global_

# Extra cell, NOT in the default grid: CPU physics (MJX on CPU) + CPU learner.
#
# The grid's GPU-free cell is envpool_cpu. This one answers a narrower
# question: what does moving *the very same JAX program* off the card cost?
# Against warp_gpu / mjx_gpu the ONLY difference is the device.
#
#   scripts/run_release_benchmark.sh --cells mjx_cpu --tasks CheetahRun
#
# Expect it to be slow. It is here to show the curve lands in the same place,
# not to compete on wall-clock — and shortening the budget for it means
# shortening it for every cell of the task, or score-vs-steps is unmatched.

release:
  cell: mjx_cpu

agent:
  device: cpu

env:
  _target_: roxie.environment.loader.build_playground_env
  env_name: ${release.task}
  device: cpu
  impl: jax
  naconmax: null
  njmax: null

runtime:
  matmul_precision: null
