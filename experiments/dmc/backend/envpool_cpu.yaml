# @package _global_

# The CPU cell of the release grid: the same 25 dm_control tasks, stepped by
# native MuJoCo inside EnvPool's C++ thread pool, with the learner on CPU too —
# so this cell is **fully GPU-free**, start to finish.
#
# Not the same code running somewhere else: playground reimplements the tasks as
# JAX/MJX programs, EnvPool wraps dm_control's own C++ physics. Two independent
# implementations of one specification at a matched budget, which is what makes
# the per-task GPU-vs-CPU score panel a parity check rather than a curiosity.
#
# The task-name translation lives in roxie.environment.suites, reached through
# the `${envpool_task:...}` resolver.

release:
  cell: envpool_cpu

agent:
  device: cpu

env:
  _target_: roxie.environment.loader.build_envpool_env
  task_id: ${envpool_task:${release.task}}
  device: cpu

runtime:
  matmul_precision: null
