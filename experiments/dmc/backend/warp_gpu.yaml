# @package _global_

# The GPU cell of the release grid: mujoco_playground's dm_control-suite envs,
# stepped by mujoco_warp on the card, with the learner on the card too.
#
# One half of the benchmark's central claim; backend/envpool_cpu.yaml is the
# other, running the same 25 tasks through an independent implementation at the
# same budget. The score curves should land in the same place.
#
# Requires warp-lang <1.13; verify with `uv run python scripts/check_warp.py`.
#
# Carries only backend-mechanical settings: bench/dmc.yaml holds everything else
# identical across cells, so this group is the ONLY thing that differs.

release:
  cell: warp_gpu

agent:
  device: gpu

env:
  _target_: roxie.environment.loader.build_playground_env
  env_name: ${release.task}
  device: gpu
  impl: warp
  naconmax: null
  njmax: null

runtime:
  matmul_precision: tensorfloat32
