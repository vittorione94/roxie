# @package _global_

# Extra cell, NOT in the default grid: GPU physics (MJX) + GPU learner.
#
# Same task, same card, different physics implementation: MJX traces the step
# into the XLA program itself rather than dispatching Warp kernels, so against
# warp_gpu this isolates the physics backend alone. Kept out of the default grid
# (350 runs already) but one flag away:
#
#   scripts/run_release_benchmark.sh --cells mjx_gpu --tasks CheetahRun,WalkerWalk
#
# MJX sizes contact arrays STATICALLY to all potential geom pairs, where Warp
# uses a budgeted global arena — see
# docs/backends.md#contact-budgets-three-backends-three-models.

release:
  cell: mjx_gpu

agent:
  device: gpu

env:
  _target_: roxie.environment.loader.build_playground_env
  env_name: ${release.task}
  device: gpu
  impl: jax
  naconmax: null
  njmax: null

runtime:
  matmul_precision: tensorfloat32
