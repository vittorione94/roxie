# @package _global_

# The three humanoid tasks in one run, on Warp. Recorded as the task
# `Multitask`, so its runs sit in the release grid beside the single-task ones.
defaults:
  - release
  - /env: multitask
  - /curriculum: null
  - _self_

release:
  task: Multitask
  cell: warp_gpu

env:
  task_defaults:
    impl: warp
  tasks:
    stand: {env_name: HumanoidStand}
    walk: {env_name: HumanoidWalk}
    run: {env_name: HumanoidRun}
  weights: {stand: 1, walk: 1, run: 1}
  parallel_envs: 256

runtime:
  device: gpu
  matmul_precision: tensorfloat32
